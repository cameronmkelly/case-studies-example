nt addiction counselors and peer recovery mentors during encounters with the local addiction treatment center.<\/p><p>Ray has recently stated; “I am tired of living this way I just want “to get clean and sober long-term; but I don’t know how.” Ray has many socioeconomic barriers including homelessness. Ray self-reports that he had recently had 4 days sober from all substances however got into an argument with a family member and relapsed last night. Ray is expressing feelings of guilt, shame, embarrassment and the urge to use again.<\/p><p>Ray’s name is well known throughout the center and some of the counselors/mentors have mixed feelings about Ray’s “want” to stay sober. Some staff believe that Ray choosing to engage in services after a relapse is a good sign. Some of the older staff who have worked with Ray are frustrated because Ray has wanted help a lot of times in the past and has always gone back to using substances each time; eating up program finances that could be spend on individuals who want to change their use. The supervisor even heard a staff member say; “Shouldn’t we give these resources to someone who is serious about changing their lives?”<\/p><p>The addiction treatment team supervisor hears both sides of the staff. The staff that have worked with Ray unsuccessfully for over 10 years show signs of burn-out (client.) The teams experience high case loads and are already stretched.  The supervisor has many years of experience and knows that recovery is individualized and not always a straight line. Ray has requested help to get into detox (withdrawal from heroin can be lethal.) Ray’s recovery mentor has contacted a detox program however there are no open beds and Ray reports; “see this is why I can never get help.” The supervisor has to make leadership decisions. The team can not find an open detox bed, and they cannot force Ray to stop using substances. The team has to find a way to respond to the situation in a way that is safe, professional, and supportive. Additionally, the supervisor must address staff concerns and burnout.<\/p><p>The supervisor requests that the addiction team call a meeting to discuss Ray’s case. The team needs to address Ray’s needs and what safety concerns are present. The team also needs to discuss thought, feelings and skills of the teams’ abilities to treat Ray.  The team needs to discuss what the next steps are going to be for Ray’s care.<\/p>", "questions": "<ol><li>What leadership decisions does the supervisor need to make in this situation?<\/li><li>How can the team support Ray?<\/li><li>How should the supervisor respond to staff frustration in a way that meets the needs of all parties involved.<\/li><li>What should the team do next if detox is not available, but Ray still wants help?<\/li><\/ol>", "note": ""}}, {"number": 11, "title": "The Promotion Everyone Expected", "cohort": 4, "section": "Think Like a Leader", "topics": ["succession", "internal promotion", "misconduct"], "skills": ["Values", "Adaptive"], "compelling_question": "When an employee has effectively been promised a promotion, what should leadership do when new evidence raises serious doubts about the choice?", "permission": "not confirmed", "words": 643, "html": {"summary": "<p>A retirement community is experiencing a change in leadership due to the fact that some of the upper management are retiring from directors’ positions, leaving some positions open and ready to be filled by internal staff. The executive director has decided to promote within the company. However, some of the employees speak up and voice that they don’t think it is necessarily the best decision. The retirement community historically has a lot of long-term employees who wish to move up in the company, but there aren’t enough positions to satisfy the need.  The human resource department was informed of some employees' displeasure with the hiring process. HR interviewed some employees in the facilities maintenance department. After much discussion, the HR director determined that there was some questionable behavior about Kyle, the employee being considered for the facilities director's position, that needed to be looked into.<\/p>", "directions": "<p>As you read this case study, consider the concept of Think Like a Leader?  When doing this, should a leader be able to be fair, ethical, and follow through with the right decision?<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk, and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, and gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components.  Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself, but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following his scenario for further discussion.<\/p>", "case": "<p>A retirement community had a large turnover of upper management staff. It has always been expected that management to promote from within. This has worked in the past, but there are concerns being raised by staff. They don’t like all of the choices that are being made for the position. An issue also arose because some of these upper management jobs aren’t posted within the company, but someone is just expected to take the role over when the current director retires.<\/p><p>After many concerns came to light, the Human Resource Director, Carol. Carol was also new to the company, but she was an exception in the fact that she was hired externally. For a position like human resources, there were no internal employees who felt they could take that position on. She decided she wanted to look into the concerns a figure out the best way to handle the situation.<\/p><p>Carol was working with the Executive Director, Frank, to fill the new positions. Frank was a 20-year employee of the company and would retire in the next five years. Frank was behind in promoting within the company. Carol stated that in a director’s position, sometimes the best candidate is external or different from the candidate that was “promised” the position. Frank said that this strategy has worked for this long; why change it now? Carol thought it might be a good idea to go further with this. Carol thought it would be a good idea for when a director’s position comes up, she would interview the staff to see what their thoughts were, as they were going to be directly affected by it. With Board approval, she decided to implement this process.<\/p><p>The Facilities Director's position was the next to come up; Kyle was set to take over this position. Carol asked around, got feedback, and wrote a company policy in order to have a protocol in place and wasted no time in starting the staff interview process. She then set up the HR Conference Room to begin setting up interviews. One by one, she called employees of the facility’s team to the conference room. After conducting the interviews, she thought it would be a good idea to include the executive director in the debriefing process.<\/p><p>Much surprise to Carol and Frank, the employees were not pleased with the direction they were going with the director. He turned out to be verbally abusive with the staff; he currently held a lead position, and it was even reported to Carol that staff members even had things thrown at them. His attitude was very moody. They then talked with Kyle, who admitted to not always behaving professionally.  Carol thought it would be a good idea to rethink Kyle in the position of Facilities Director, Frank wanted to put him through anger management classes. Frank went ahead a started the process with Kyle taking classes. Carol wanted to meet with staff after Kyle had been in the position for a month.<\/p>", "questions": "<ol><li>In this scenario, did Carol think like a leader?<\/li><li>What ways did Carol show that she made good choices implementing the new policies?<\/li><li>Do you think that Frank or Carols resolution for Kyle was a better resolution. Why or why not?<\/li><li>What would you have done differently from Carol. From Frank?<\/li><li>Would you have kept Kyle in the directors position?<\/li><\/ol>", "note": ""}}, {"number": 12, "title": "Friendly, Capable, and Not Pulling His Weight", "cohort": 4, "section": "Think Like a Leader", "topics": ["performance", "accountability", "avoiding a hard conversation"], "skills": ["Triggers", "Uncertainty", "Adaptive"], "compelling_question": "How long should a leader gather information before a pattern of small concerns becomes something that must be addressed directly?", "permission": "not confirmed", "words": 569, "html": {"summary": "<p>A shift supervisor in a juvenile detention facility must navigate ongoing concerns about a staff member’s performance, accountability, and interactions with youth. While the staff member maintains generally positive relationships on the surface, underlying frustrations among the team and potential boundary concerns create a complex leadership challenge involving trust, communication, and decision making under pressure.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>Morgan, a shift supervisor at a juvenile detention facility, regularly works evening shifts with a team of full time and relief staff. Among them is Cody, a staff member Morgan works with multiple nights each week.<\/p><p>On the surface, Cody is easy to get along with. He maintains a friendly demeanor with both staff and youth, and interactions with him are rarely openly confrontational. Morgan has generally had positive one on one interactions with Cody, and their working relationship feels functional.<\/p><p>However, over time, Morgan begins to notice patterns. During shifts, Cody often avoids responsibilities, particularly intake duties, expressing frustration or finding ways to stay occupied elsewhere. Intakes should only take 45 minutes to an hour but Cody generally takes 2 hours or more. This is concerning because it takes him “off the floor” and leaves the other staff on shift with more work to do and less for the kids. When tasks are assigned, Cody completes the minimum requirements but rarely takes initiative beyond what is explicitly asked. This is concerning because in a 24-hr facility, there are always things that need to be done and some staff end up spending their time picking up the slack.<\/p><p>Other staff have started approaching Morgan privately with concerns. They describe feeling that workloads are uneven and that Cody is not pulling his weight. Some express frustration that expectations don’t seem to be applied consistently. A few have also mentioned that Cody’s interactions with youth sometimes appear overly lenient, as Cody struggles to hold youth accountable or reinforce boundaries.<\/p><p>At the same time, Morgan has observed moments where Cody’s rapport with youth helps de-escalate situations, which complicates the overall picture. There is no single major incident, but rather a pattern that is difficult to clearly define or document.<\/p><p>When informal concerns surface during a shift, Cody tends to become defensive if questioned, often explaining his decisions in a way that shifts focus to external factors or minimizes the concern. This has made Morgan hesitant to address issues directly without careful consideration.<\/p><p>Morgan begins to feel caught between multiple responsibilities: maintaining a functional working relationship with Cody, responding to staff concerns, ensuring consistent expectations, and upholding standards related to safety and youth supervision. Morgan has built a reputation as a collaborative supervisor who values positive working relationships. Rather than confronting issues immediately, Morgan prefers to gather information and look for patterns before acting. Staff generally appreciate Morgan's fairness, but some have privately commented that concerns can linger too long before being addressed.<\/p><p>During one shift, staffing is tight and intake responsibilities need to be reassigned. As the shift progresses, it becomes apparent that Cody is again avoiding the intake area, while other staff pick up the workload. One staff member makes a pointed comment to Morgan about fairness. Meanwhile, a youth interaction raises a subtle concern about whether expectations are being consistently enforced.<\/p><p>Morgan must decide how and when to intervene, what to address in the moment versus later, and how to balance team dynamics with individual accountability.<\/p><p>The shift continues, but the underlying tensions remain unresolved.<\/p>", "questions": "<ol><li>What are the main challenges Morgan is dealing with in this situation? What priorities are competing with each other?<\/li><li>How might Morgan’s own personality or leadership style be affecting how they handle Cody and the team?<\/li><li>Which parts of this situation are clear rule or duty issues, and which parts are more about attitudes or team culture?<\/li><li>How could Morgan talk to Cody about these concerns in a way that doesn’t immediately make him defensive?<\/li><li>What could Morgan do going forward to make expectations clearer and improve fairness across the team?<\/li><\/ol>", "note": ""}}, {"number": 13, "title": "When Your Boss Undermines the System You Built", "cohort": 4, "section": "Think Like a Leader", "topics": ["managing up", "workplace politics", "ethics"], "skills": ["Uncertainty", "Values", "Process"], "compelling_question": "What options does a leader have when organizational improvement creates direct conflict with a supervisor who benefits from the old way of working?", "permission": "not confirmed", "words": 980, "html": {"summary": "<p>In this case study, you will read about Andrea Wells, the Head of Operations at a satellite office of Boomer Heights Inc., a manufacturing company. She worked on restoring structure and leadership and trained staff to follow proper company policy and procedures. Over time, Andrea successfully improved operations and rebuilt the plant's reputation. This brought resentment toward her from Gary, her Supervisor, who felt threatened by her. Gary hired Becca to train and mentor in hopes of replacing Andrea.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>Andrea Wells works as the Head of Operations for Boomer Heights Inc. Her position is located at an off-site satellite location. She has been with the company for 7 years. She has worked hard to keep the satellite location running smoothly, adhering to company policies and procedures (P&amp;P), and maintaining consistency with the main office.<\/p><p>7 years ago, when Andrea went through the interview process, she recognized that the office was somewhat disorganized. She could tell that the leadership in this location was very hands-off. To Andrea’s observation, she was right. Everyone in the office was operating independently; the staff were the ones who kept business rolling, with little direction from leadership. While this was something to be thankful for, it also highlighted the fact that leadership had no role and that the team’s unity was missing. Andrea had to move quickly to learn her job, establish relationships, and gain trust before considering any changes.<\/p><p>During this time, she would attend meetings or trainings at headquarters. This was nice to make connections with staff outside of her location and learn more about company policies and procedures. Often, when she attended these events, she would get comments about her location operating independently and not following the company's policies &amp; procedures. Mostly, the response was “oh, that location,” after being asked what area of the company she worked in. This really bothered Andrea, and she was determined to shake the reputation her location had. She buckled down on training and brought folks in from headquarters to provide hands-on training for her staff. Conducted staff meetings and outside gatherings to establish unity. Things reached a point where people began to recognize the change in the location, and the reputation was changing.<\/p><p>She worked with leadership, sharing her decision-making process, and emphasized the importance of consistency across the company. Through this, employees saw improvement and felt a sense of pride in the location where they worked. She even had a few comments from staff at headquarters on how things were shaping up in her office, to the point that the leadership in her office began to notice and became more involved.<\/p><p>As leadership became more involved, they recognized that the staff, including other employees who did not report to Andrea, were coming to her for directions. In fact, the satellite location was running better than before, under Andrea’s leadership. Her supervisor, Gary, was very impressed and commented on her work ethic and abilities. He was glad to have someone he could rely on.<\/p><p>As time went on, though, Gary began to feel resentment since he noticed Andrea was acquiring more control over the function of the operation at “his” satellite location. He started a conversation with Andrea that made Andrea feel like the work she was doing was now an issue. She began to feel push back from Gary; he wanted things to be the way they were when he could do whatever he wanted and not have to answer to Headquarters. After all, he had been operating the satellite in that manner for over 15 years before Andrea joined the team.<\/p><p>Gary began to undermine her behind her back, putting up barriers to any changes and work that Andrea was involved in. Andrea began to recognize that there was a tug-of-war for control happening and wasn’t quite sure how to handle it. Even though she received support from all the staff at the location, she noticed that keeping things in check was becoming more difficult because Gary asked staff to carry out tasks that caused them to revert to old habits of improper processes and procedures. As a result, Andrea's time and energy were being focused on fixing mistakes and retraining staff. Staff reported to her that Gary would say,” Just do what he asked, and if there is an issue, Andrea could fix it later.”<\/p><p>Gary hired a new employee, Becca, and began mentoring her with hopes of replacing Andrea. The new employee, who had become very fond of Gary and recognized that if she played her cards right, she could very well take the place of Andrea. Initially, the new employee attempted to keep the peace between Gary and Andrea. Trying to meet the demands of pleasing the Supervisor, but staying within company P&amp;P. After a while, this got exhausting, and Becca gave in to Gary, who promised plenty of opportunities as long as Becca played along with his style of doing things. The employee began to view Andrea as a barrier and started avoiding her and leaving her out of decision-making. After all, Andrea’s position did not influence Becca’s future success in the company.<\/p><p>Gary’s intentions were becoming clear each day. Andrea was now trying to keep up with both Gary and Becca’s wild-wild-west approach to running the location operations. She began to withdraw as a leader due to concerns about unethical practices and wanted to distance herself from any problems. Andrea understood that her reputation was more important than winning this battle. The staff were back to having no leader to follow, and Andrea decided to move on.<\/p><p>This story is about how strong leaders can do good work and grow companies, but without the backing of management, they can lose the will to lead. Often, leaders need to navigate workplace politics, leadership conflicts, insecure management, and are exposed to witnessing unethical practices. This can wear down a good employee.<\/p>", "questions": "<ol><li>Do you think Andrea handled the situation well? What would you have done differently?<\/li><li>How do you handle workplace politics? Do you think this approach (your response) reflects a good leader?<\/li><li>As a leader, what is your approach to handling an insecure supervisor?<\/li><li>Do you agree with this thought? “As long as unethical behaviors from my supervisor or co-worker are not affecting me, I don't worry about it. I mind my own business”. Explain your answer.<\/li><\/ol>", "note": ""}}, {"number": 14, "title": "The Call Everyone Was Watching", "cohort": 4, "section": "Think Like a Leader", "topics": ["crisis decision", "authority and responsibility", "public scrutiny"], "skills": ["Uncertainty", "Values"], "compelling_question": "What does leadership require when you are not the highest-ranking person present, but everyone is waiting for you to decide?", "permission": "not confirmed", "words": 545, "html": {"summary": "<p>A patrol officer in a large city responds to a mental health crisis at a busy transit platform that quickly becomes a high-visibility incident. As multiple stakeholders—including a partner officer, supervisor, transit security personnel, dispatch, and the public—offer competing perspectives, the officer must navigate uncertainty, conflicting priorities, and mounting pressure. This case explores what it means to think like a leader when formal authority is limited but responsibility remains.<\/p>", "directions": "<p>As you read this case study, consider the concept of Think Like a Leader. Effective leaders identify key decisions, gather information, assess risks, and determine the best course of action despite uncertainty. Look for evidence of leadership strengths, vulnerabilities, conflict management, competing values, and decision-making under pressure.<\/p>", "case": "<p>Officer Casey M. had about three years on the job and a reputation for being dependable. Casey was not the loudest officer in the room or the first to seek attention, but coworkers trusted that calls would be handled professionally.<\/p><p>On a rainy Thursday evening, Casey and Officer Riley D. were dispatched to a welfare check at a busy transit platform. Dispatch notes indicated a male subject yelling, pacing, possibly suicidal, with several prior contacts. Transit security was already on scene and requesting police assistance.<\/p><p>When the officers arrived, the situation was tense but controlled. The subject, referred to as Leo, paced near the platform edge while shouting intermittently. Several commuters had already begun recording with their phones.<\/p><p>\"He's been escalating for twenty minutes. We need him gone,\" a transit security officer said. \"This is beyond what we can handle.\"<\/p><p>Casey began speaking with Leo from a safe distance, attempting to slow the situation down. Leo responded angrily but had not committed a crime or made a clear threat.<\/p><p>\"We're going to end up chasing him onto the tracks if we don't move,\" Riley said. \"We should just grab him.\"<\/p><p>Before Casey could respond, Sergeant Paul H. arrived and asked for an update. After hearing the situation, he commented, \"We're not letting this turn into a spectacle. Too many cameras.\"<\/p><p>Dispatch then advised that the mobile crisis team was responding but delayed and requested officers avoid enforcement action if possible until the team arrived.<\/p><p>Casey knew the department's response model for mental health calls emphasized de-escalation whenever it could be done safely. Officers were encouraged to use crisis resources and communication before enforcement action when circumstances allowed. At the same time, policy recognized that officers sometimes had to make immediate decisions when safety concerns developed. The challenge was that policy could not account for every situation.<\/p><p>As the situation continued, Leo moved closer to the platform edge. The crowd grew larger. Nearly everyone had a phone out. Transit security wanted action. Dispatch wanted patience. Riley appeared ready to intervene physically. Sergeant Paul watched carefully but offered no clear direction.<\/p><p>Because Casey had made first contact with Leo, everyone seemed to be looking to Casey for a decision.<\/p><p>\"We're past talking,\" Riley said quietly.<\/p><p>\"Make a decision,\" Paul replied.<\/p><p><strong>Decision Point<\/strong><\/p><p>Casey must decide whether to physically detain Leo before the situation escalates further, continue de-escalation efforts while waiting for the crisis team, challenge the expectations of the partner and supervisor, or deliberately slow the situation down despite growing frustration from others on scene.<\/p><p>Everyone on scene had an opinion about what should happen next, but no one had fully taken ownership of the decision. As the crowd continued to watch and the crisis unfolded, Casey was left to determine what leadership looked like in a moment where rank, responsibility, and influence were no longer clearly aligned.<\/p>", "questions": "<ol><li>Where do you see leadership being demonstrated in this situation, and where is leadership absent?<\/li><li>What competing values and priorities are influencing decision-making for the people involved?<\/li><li>How should Casey evaluate the risks of immediate action versus continued de-escalation when information is incomplete?<\/li><li>What does effective leadership look like when you are not the highest-ranking person on scene but are expected to make the decision?<\/li><li>How could communication and alignment among the responding parties have been improved before reaching this decision point?<\/li><\/ol>", "note": ""}}, {"number": 15, "title": "The Leadership Structure That Broke Collaboration", "cohort": 4, "section": "Think Like a Leader", "topics": ["restructuring", "peer collaboration", "first-time leaders"], "skills": ["Outward", "Adaptive", "Process"], "compelling_question": "When an organization redesigns its structure, who is responsible for making sure leaders learn how to operate across the new boundaries?", "permission": "not confirmed", "words": 542, "html": {"summary": "<p><em>(Summary taken from the cohort four index. The author did not write one.)<\/em><\/p><p>A growing medical-equipment supplier replaces its geographic management structure with segment-based leadership across sales, operations, repair, and fulfillment. Experienced and first-time directors must suddenly lead interdependent functions without the old structure connecting them. Personality conflict and communication breakdown follow. A DISC-based team-building effort improves several relationships, but one cross-segment partnership remains strained years later. The case asks whether structural redesign can succeed if leaders are not equally prepared to collaborate across the new boundaries.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>A large medical equipment supplier was undergoing significant growing pains. To address operational inefficiencies and better align with strategic goals, the company decided to completely overhaul its Organizational Leadership structure. This transformation involved eliminating traditional area and regional manager roles and introducing new segment-based leadership positions in Sales, Operations and Repair.<\/p><p>The restructuring meant that existing leaders who once oversaw entire branches or regions were now responsible for just one segment. Some employees were promoted into director roles despite lacking prior leadership experience or a complete understanding of how each segment influenced the others. Among the new appointed leaders were the Director of Sales Operations (DSO) who was a seasoned leader who had risen through the ranks from customer service to Area Manager. The Director of Order Operations Processing (DOP) and Director of Order Fulfillment (DOF) were new to leadership and had never managed director reports before.<\/p><p>Tensions quickly surfaced. The DSO, confident in her experience, began instructing the DOP and DOF on how to manage their responsibilities. Her approach was perceived as abrasive, and during her annual review, the VP of Commercial Sales shared that other directors found her difficult to work with.<\/p><p>Collaboration issues weren’t limited to the DSO. The VPs observed broader communication breakdowns across the leadership team and decided to host a half-day team-building session six months after the transition. Each leader completed a DISC Personality Test beforehand to foster self-awareness and mutual understanding. The team-building event was a turning point. The DSO began adjusting her approach, using DISC insights to better understand herself as well as her colleagues. She initiated a Teams channel and monthly director calls to continue to improve communication. Directors also began collaborating on monthly Townhall meetings for staff across six branches, though consistency in messaging remained a challenge.<\/p><p>Two years later, relationships across leadership have evolved. The DSO now has a strong partnership with the DOP as well as the Director of Service Fulfillment (DSF). They collaborate regularly on strategies to better serve their clients. Their efforts have led to measurable improvements in key performance indicators, surpassing company benchmarks in several areas.<\/p><p>However, the relationship between the DSO and DOFs remains strained. Communication is minimal and inconsistent. The DOFs are often unresponsive to emails and messages, and when they do reply, they tend to be vague or avoid direct answers. This lack of transparency makes it difficult for the DSO to plan effectively or align on shared goals. Additionally, the DOFs show limited foresight into operational planning such as planning for coverage when their employees take time off, which disrupts service continuity and puts pressure on other segments. This on-going disconnect continues to challenge cross-segmental collaboration and highlights the need for stronger leadership alignment and accountability.<\/p>", "questions": "<ol><li>How should an experienced leader approach a change in position with new less experienced leaders?<\/li><li>What other strategies could leaders use to foster collaboration across segmented teams?<\/li><li>What role should senior leaders take with their directors to help with changes in roles and cross-collaboration?<\/li><li>How can personality assessments like DISC support leadership development and communication?<\/li><li>How should the DSO respond when peers consistently fail to communicate and collaborate?<\/li><\/ol>", "note": ""}}, {"number": 17, "title": "The Captain Who Bent the Rule", "cohort": 4, "section": "Think Like a Leader", "topics": ["policy and people", "fatigue", "managing up"], "skills": ["Uncertainty", "Values"], "compelling_question": "How should a leader balance policy compliance with a responsibility to recognize fatigue, morale, and human limits?", "permission": "not confirmed", "words": 850, "html": {"summary": "<p>A medium-sized metro fire department of roughly 100 personnel operates out of five stations and serves a fast-growing suburban area. The department prides itself on teamwork and professionalism but has been navigating internal challenges related to generational turnover and differing expectations around leadership communication and work-life balance. This case focuses on Fire Captain Neil Garrett, a seasoned company officer who faces a leadership test when operational efficiency, morale, and individual wellbeing come into conflict.<\/p>", "directions": "<p>As you read this case study, consider the concept of Think Like a Leader? When doing this a leader should be able to<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers.<\/li><li>Get used to uncertainty and conflict.<\/li><li>Choose among competing values.<\/li><li>Distinguish between technical and adaptive.<\/li><li>Understand the process challenge.<\/li><\/ul>", "case": "<p>Captain Neil Garrett had served in the fire service for more than 20 years and was widely respected as calm under pressure and fair in his approach. Assigned to Station 2 — one of the department’s busiest fire stations— he supervised two lieutenants and eight firefighters across three shifts. His crew had strong technical skills, but personality differences sometimes created friction.<\/p><p>Station 2 was known for running many calls and out-working those around them. Calls came frequently, and overtime was routine. While the crews took pride in their reputation, the pace had begun to take its toll. Fatigue, stress, and frustration about mandatory overtime were quietly mounting.<\/p><p>The department’s new Fire Chief, who came from a larger urban agency, had begun emphasizing stricter accountability for performance and readiness. Reports, training documentation, and maintenance logs were now reviewed weekly. The goal, the Chief said, was “to modernize and professionalize operations.”<\/p><p>Many welcomed the change, but others felt micromanaged. Captain Garrett understood both sides — he supported accountability but also recognized that morale was declining. One morning, he overheard a firefighter muttering, “We spend more time documenting training than actually doing it.” He didn’t respond directly, but made a mental note.<\/p><p>Two weeks later, the station’s senior fire fighter, Engineer Dave Kowalski, approached him after shift. “Cap,” he said, “we’re burning out. The mandatory overtime is killing us. Guys are tired, and we’re getting sloppy.”<\/p><p>Neil listened carefully and promised to raise the issue with the Battalion Chief. When he did, he was told that staffing shortages made overtime unavoidable. “You’re not the only one dealing with it,” the Chief said. “Tell your people to push through.”<\/p><p>Neil passed along the message during the next lineup. The reaction was tense but professional. Afterward, one of the newer firefighters, Jesse Pruitt, stayed behind. “With all due respect, Captain,” he said, “people are talking about transferring. We just need to know someone’s looking out for us.”<\/p><p>That night, Neil couldn’t sleep. He remembered his own early years — long shifts, exhaustion, and the captains who either ignored it or quietly took care of their crews. He wondered which kind of leader he was becoming.<\/p><p>A week later, Station 2 responded to a major apartment complex fire — multiple rescues, prolonged overhaul, and 16 straight hours on scene. By the time the crew returned to quarters, everyone was completely drained. Reports still needed to be filed, but most of the firefighters were barely staying awake.<\/p><p>Following policy, Neil should have required the reports to be completed before personnel left for home. Instead, he dismissed the crew, telling them to rest and submit their paperwork after their next shift.<\/p><p>Later that afternoon, the Battalion Chief called. “Why aren’t your reports in? Everyone else is done.” Neil explained the situation, but the Chief was unsympathetic. “We all work long hours,” he said. “You know the rules.”<\/p><p>The following day, he received an email from the Deputy Chief noting that his shift’s delay had caused an “administrative discrepancy.” Neil felt embarrassed and frustrated — he’d made a decision he believed was right for his people, and it seemed to have backfired on him.<\/p><p>At the next shift change, Neil gathered his crew. “I know you’re tired,” he said. “But I also know we have to meet expectations. From now on, we’ll complete our reports before going home. If we get another long night, I’ll stay and help finish them.”<\/p><p>His message was met with quiet nods. But later that week, he noticed a small gesture: the crew had completed their reports early and left him a note that said, ‘Thanks for having our backs, Cap.’<\/p><p>Over the next month, the tone in the station shifted. Neil began scheduling short “crew check-ins” — 10 minutes each week where anyone could raise issues or ideas. He pushed training earlier in the day to avoid overtime fatigue and adjusted the rotation so that the same firefighters weren’t always taking cleanup or gear duties after late-night calls.<\/p><p>It wasn’t a perfect fix — overtime remained high, and paperwork was still heavy — but the atmosphere improved. The crew began to trust that decisions were being made with fairness and understanding, even when they disagreed with them.<\/p><p>Three months later, the Fire Chief held a departmental leadership meeting. He specifically cited Station 2’s improved compliance and morale, saying, “Whatever you’re doing over there seems to be working.”<\/p><p>Neil didn’t mention that his approach wasn’t written in any manual. He’d learned that leadership wasn’t just about enforcing policy — it was about understanding when people needed direction and when they simply needed to know their leader saw them as human.<\/p>", "questions": "<ol><li>Where did Captain Garrett show strong leadership, and where did he struggle?<\/li><li>How did Captain Garrett’s decisions affect trust and morale within his crew?<\/li><li>What leadership qualities were most tested during the station’s transition?<\/li><li>How might you have handled the situation differently in Captain Garrett’s position?<\/li><li>What does this case teach about “thinking like a leader” during organizational change?<\/li><\/ol>", "note": ""}}, {"number": 18, "title": "The Exception That Became a Precedent", "cohort": 4, "section": "Think Like a Leader", "topics": ["policy exceptions", "precedent", "remote work", "retention"], "skills": ["Values", "Adaptive"], "compelling_question": "When a long-standing policy no longer fits how an organization works, how should leaders decide between consistency, fairness, and flexibility?", "permission": "not confirmed", "words": 1160, "html": {"summary": "<p>A small quasi-governmental nonprofit association with fewer than 40 employees operates in a hybrid work environment where most staff work remotely part of the time. For years, the organization maintained a policy requiring employees to reside in the state, although few current leaders fully understood why the policy had originally been created. After one accidental hiring exception allowed an employee to work remotely from a neighboring state, leadership began reconsidering whether the policy still made sense in a changing workforce environment. When a highly valued long-term employee later requested temporary permission to relocate to a city several hours away in that state to support their spouse’s graduate program, leadership faced difficult questions around fairness, retention, organizational culture, and long-term precedent.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>The association is a small quasi-governmental nonprofit organization with fewer than 40 employees. The organization supports members throughout the state and operates in a largely hybrid work environment. While staff occasionally work in the office for meetings, events, or collaborative projects, many employees spend much of their time working remotely.<\/p><p>For years, the organization maintained a policy requiring employees to reside in the state. The policy had existed long before the current executive leadership team arrived, and while leaders believed it likely related to tax, licensing, payroll, liability, or organizational culture concerns, no one could fully explain the original reasoning behind it. No documentation could be found explaining why the policy had been adopted or whether the factors that originally justified it still existed. Because the organization had historically hired locally, the policy had rarely been questioned. As discussions began, leadership found themselves debating whether they were protecting an important organizational safeguard or simply following a policy that no longer aligned with the realities of a modern hybrid workplace.<\/p><p>Several years into expanded hybrid work arrangements, the organization hired a new Director of Operations through an outside recruiting agency. At the time, the organization did not have an internal human resources department and relied heavily on the recruiting firm to manage the hiring process. After the position was offered and accepted, leadership discovered that the employee lived just across the state line. The hiring manager had not noticed the address during the hiring process, and leadership debated whether rescinding the offer would be appropriate. Ultimately, leadership decided to move forward with the hire rather than lose the candidate after the offer had already been accepted.<\/p><p>This decision created additional administrative work for the organization. Payroll taxes needed to be adjusted, licensing requirements in the neighboring state had to be addressed, and new processes had to be created to support an out-of-state employee. While some leaders viewed the situation as manageable, others worried the organization had unintentionally created a precedent that would be difficult to reverse.<\/p><p>At the same time, some members of leadership began discussing whether the organization should formally expand its residency policy to include the area just across the state line. They argued that expanding hiring boundaries could improve recruitment opportunities and create access to a larger pool of candidates in a competitive labor market. Other leaders disagreed, pointing out that previous employees had been told they could not relocate outside the area while keeping their positions. They worried that changing the policy now could appear inconsistent or unfair to long-term staff who had followed the original expectations.<\/p><p>Several leaders also noted that previous employees had made personal and professional decisions based on the understanding that in-state residency was a condition of employment. Some had declined relocation opportunities, while others had chosen to remain in the state despite family or lifestyle preferences elsewhere. These leaders questioned whether changing the policy now would be fair to employees who had complied with the expectation for years without requesting exceptions.<\/p><p>Over time, the organization established the payroll processes, licensing, and tax registrations necessary to support employment in the neighboring state. While leadership still debated whether expanding geographic boundaries was a good long-term strategy, the organization now had active systems in place to support an out-of-state employee.<\/p><p>About a year later, another employee approached leadership with a request. This employee had worked for the organization for seven years in a high-level administrative role and was widely viewed as one of the organization’s strongest performers. They were dependable, well respected by coworkers, and played an important role during the organization’s busiest event seasons.<\/p><p>The employee explained that their spouse had been accepted into a master’s degree program in a city several hours away in the neighboring state, and requested a temporary 18-month agreement allowing them to relocate while continuing their employment. The employee proposed maintaining a hybrid schedule and agreed to return to the office as needed during major events or high-demand periods. Because the organization was already supporting an employee working from the neighboring state, leadership felt the request was more difficult to deny, even though that city extended beyond the geographic boundaries some leaders had previously discussed informally.<\/p><p>Leadership immediately recognized the complexity of the situation. On one hand, the organization wanted to retain a highly valued employee during a time when recruiting experienced staff had become increasingly difficult. Some leaders also believed the existing residency policy no longer aligned with the organization’s hybrid work culture, especially since many employees were rarely physically present in the office.<\/p><p>On the other hand, several concerns quickly emerged. The city was significantly farther away than the area just across the state line, which leadership had only informally discussed as a possible expansion area. Other employees had already begun asking questions about whether they, too, could relocate out of state while keeping their positions. One employee reportedly asked whether moving to a different neighboring state would now be acceptable since it was “only one state away.”<\/p><p>Leadership also struggled with the temporary nature of the request. The employee stated that the arrangement would end after the spouse completed the graduate program, and the temporary agreement was formally approved with a fixed end date. However, there was no guarantee the spouse would later find employment back in the home state. Some leaders worried that approving the temporary request could eventually place the organization in a difficult position if the employee later requested a permanent out-of-state arrangement or if future employees expected similar flexibility.<\/p><p>As discussions continued, leadership found themselves debating much larger questions than a single employee request. Some leaders argued the organization should modernize its policies to better match changing workforce expectations and improve long-term recruitment opportunities. Others worried that making exceptions for highly valued employees could create perceptions of favoritism, damage trust among existing staff, and gradually erode consistency in organizational decision-making. The conversation increasingly shifted away from one employee’s request and toward a broader leadership challenge: How should leaders respond when a long-standing policy no longer aligns neatly with organizational realities, employee expectations, and competing values?<\/p><p>Leadership now had to decide whether to approve the request and, more importantly, whether the organization’s residency policy should remain unchanged, be expanded, or be reconsidered entirely.<\/p>", "questions": "<ol><li>How should leaders determine whether a long-standing policy still serves the organization’s current needs?<\/li><li>What factors should leadership consider when deciding whether to make exceptions for high-performing employees?<\/li><li>How can leaders balance employee retention with fairness and consistency across the organization?<\/li><li>Is this situation primarily a technical challenge, an adaptive challenge, or both? Explain your reasoning.<\/li><li>If you were part of the leadership team, what would you recommend and why?<\/li><\/ol>", "note": ""}}, {"number": 19, "title": "The Pay Gap Nobody Mentioned", "cohort": 4, "section": "Think Like a Leader", "topics": ["pay equity", "hiring", "communication", "turnover"], "skills": ["Outward", "Adaptive", "Process"], "compelling_question": "How can a leader build a culture where people raise fairness and pay concerns directly, before they quietly walk out the door?", "permission": "not confirmed", "words": 969, "html": {"summary": "<p>Hillcrest Family Dental, a long standing private practice, has served its community for decades under multiple generations of family ownership. When Dr. Laura Simmons took over the practice, she sought to maintain its patient-centered legacy but soon discovered the challenges of leadership, communication, and staff management that come with business ownership. Over time, issues of pay inequity, unclear communication, and lack of trust led to declining morale and staff turnover. Despite good intentions, Dr. Simmons’s reactive hiring and inconsistent transparency created tension between new and existing team members.<\/p>", "directions": "<p>As you read this case study, consider the concept of Think Like a Leader. Reflect on how Dr. Simmons’s leadership decisions and communication strategies have influenced staff morale, trust, and retention.<\/p><p>As you read, look for examples of:<\/p><ul><li>How leadership decisions affect both individuals and the overall team culture.<\/li><li>Opportunities where proactive communication and transparency could have improved outcomes.<\/li><li>Moments where shifting focus outward, understanding competing values, or navigating uncertainty could have made a difference.<\/li><li>Differences between technical fixes (hiring a replacement) and adaptive challenges (building trust, maintaining morale).<\/li><\/ul><p>After reading, use the discussion questions to explore how thinking like a leader could have helped Dr. Simmons anticipate challenges, maintain staff trust, and strengthen the practice culture.<\/p>", "case": "<p>Hillcrest Family Dental, a private family-owned practice in a small city has been serving the community for decades. Founded by Dr. Edwin Aldridge, it was later passed down to his son, Dr. Robert Aldridge, and eventually to his grandson, Dr. Stephen Aldridge. When Dr. Stephen retired, he sold the practice to his associate, <strong>Dr. Laura Simmons<\/strong>, a compassionate and skilled dentist known for the same clinical excellence and integrity as Dr. Stephen.<\/p><p>Although Dr. Simmons always dreamed of becoming a dentist, she never envisioned herself as a business owner. However, she wanted to honor the legacy of the Aldridge family by maintaining the same patient-centered, family-style atmosphere.<\/p><p>For decades, Hillcrest Family Dental was known for its unusually low staff turnover. Many employees had worked there for years, and even decades, creating lasting relationships with patients and watching generations of families grow.<\/p><p>When Dr. Simmons took ownership, she quickly realized that leading a practice came with many challenges that went beyond clinical dentistry. Within a few years, several longtime employees retired, and one long-term hygienist left the field entirely.<\/p><p>Staff began expressing, directly or indirectly, that they didn’t feel valued. Concerns centered around unclear communication, feeling unheard when challenges arose, and pay inequities compared to newer hires. They also felt they could not communicate their concerns with Dr. Simmons and feel as though they were heard and understood. Staff often expressed they left conversations feeling as though they were the problem. Staff also felt that the office manager, <strong>Megan<\/strong>, who fell into the role without strong leadership skills, often seemed disconnected from the team and avoided conflict.<\/p><p><strong>Tara<\/strong>, a hygienist who had worked at the office for seven years, discovered that <strong>Brooke<\/strong>, a newly graduated hygienist working only one day per week, was earning significantly more per hour. Tara felt disheartened and undervalued. When she approached Dr. Simmons to discuss a raise, she was told it wasn’t possible. Not wanting conflict, Tara soon left for another practice without explaining her reasons for leaving.<\/p><p>Her replacement, <strong>Dana<\/strong>, was an experienced hygienist who also left after just one year. She later shared that she felt siloed and that her input wasn’t welcomed. She felt she was just there to “clean teeth.” Again, no direct feedback was given to Dr. Simmons before Dana’s departure.<\/p><p><strong>Paula<\/strong>, another hygienist who had been hired around the same time as Dana, saw the job posting for Dana’s position listed at a higher wage than her own. Feeling discouraged, she decided to reduce her schedule to part-time. Like others, she didn’t tell Dr. Simmons that pay inequity was part of the reason. She felt that Dr. Simmons wouldn’t understand or acknowledge the concern even if she did.<\/p><p>Around the same time, Dr. Simmons hired <strong>Nicole<\/strong>, a dental assistant two years out of school, at a higher wage than her peers, including <strong>Hannah<\/strong>, Nicole’s former classmate who had been with the practice for two years, and <strong>Sharon<\/strong>, a respected assistant who had been working at the office for thirteen years.<\/p><p>Dr. Simmons had high expectations for Nicole, expectations that exceeded her experience level. As Nicole struggled to meet them, she felt discouraged and inadequate. Meanwhile, other team members felt their loyalty and skill were overlooked. When Sharon voiced her concerns, Dr. Simmons admitted she had made the hire “out of desperation,” but tensions continued.<\/p><p>Eventually, Nicole was let go, and <strong>Kayla<\/strong>, a newly graduated assistant, was hired. The following year, <strong>Sierra<\/strong>, another new graduate, joined the team, earning $1 more per hour than Kayla. Kayla discovered the discrepancy in pay and felt hurt and undervalued, especially since she had the more advanced clinical skills.<\/p><p>Kayla confided in Sharon, who again approached Dr. Simmons to express how these decisions were affecting morale and trust. Dr. Simmons dismissed the concern, saying it was “silly” for someone to be upset over a small wage gap. Dr. Simmons also felt that because Kayla planned to eventually leave to pursue another career, she wasn’t obligated to offer her a higher wage. However, Sierra was also planning to leave after a year to return to school.<\/p><p>During the same conversation with Sharon, Dr. Simmons explained that the hiring landscape had become increasingly challenging and that, in order to attract new employees, she felt pressured to offer whatever wage candidates requested. She added that the current staff needed to understand this reality.<\/p><p>After their conversation, Dr. Simmons texted Kayla to say she had heard that Kayla might be upset about her wages and offered to talk with her about it. She added that she wished Kayla had felt comfortable coming to her directly and mentioned she had thought their pay rates were the same. Dr. Simmons said she was willing to increase Kayla’s wage by $1 per hour, but also asked her to “put herself in her shoes,” explaining “if you knew an employee was planning to leave, would you be inclined to give her more money?” She also reminded Kayla that the office budget was tight at the time.<\/p><p>By the end of these events, Hillcrest Family Dental continued to provide excellent patient care but still struggled with staff trust. Despite Dr. Simmons’s good intentions, inconsistent communication, pay differences, and reactive decision making left the team feeling undervalued and uncertain about their roles, especially among longer-term employees.<\/p>", "questions": "<ol><li>In what ways could Dr. Simmons have applied leadership thinking to address staff concerns about fairness and communication, rather than responding to staffing challenges impulsively or out of desperation?<\/li><li>In what ways could consistent and transparent communication have prevented misunderstandings and loss of trust among the team?<\/li><li>What leadership mindset shifts might help Dr. Simmons move from a reactive approach (filling positions quickly) to a proactive one focused on culture, equity, and long-term retention?<\/li><li>How might Dr. Simmons engage her team in problem-solving around pay structure and hiring challenges to build collaboration instead of resentment?<\/li><li>If you were in Dr. Simmons’s position, what steps would you take to rebuild trust and reestablish a sense of value among your staff?<\/li><\/ol>", "note": ""}}, {"number": 21, "title": "Two Days Before Christmas", "cohort": 4, "section": "Think Like a Leader", "topics": ["layoffs", "ethics", "going around a boss"], "skills": ["Uncertainty", "Values"], "compelling_question": "When a director’s instructions conflict with what you believe is right for your people, how should a leader act without breaking trust in either direction?", "permission": "not confirmed", "words": 685, "html": {"summary": "<p>Fifteen temporary employees were hired by an outsourcing company to provide product support for a client during their higher contact volumes from late November to early January. Due to the efficiency of the temporary hires, the client requested that these fifteen staff members be laid off two days before Christmas. The manager overseeing the client’s project was tasked with laying off these staff members individually. There are a limited number of positions available with other clients, but the director of the outsourcing organization did not want the manager to tell the employees about them during the layoff conversation.<\/p>", "directions": "<p>As you read this case study consider the concept of Think Like a Leader? When doing this a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul>", "case": "<p>An outsourcing organization has a contract with a client to have fifteen employees provide their product support. In anticipation of high service requests during the holiday season, the client asks to add another fifteen temporary employees. Victor, the manager overseeing the program, hires fifteen temporary workers with the expectation that they would work from late November to mid-January. Though these hires knew they were seasonally hired, the outsourcing organization may have openings with other clients after their contract ends in mid-January.<\/p><p>The week before Christmas, the client informs Victor that the temps have so effectively managed product support volumes that their services are no longer needed through mid-January. The client tells Victor that the fifteen temps’ last day was two days before Christmas, giving them less than a week’s notice of their severance.<\/p><p>Victor is distraught at giving this news to so many people relying on additional paychecks during the holiday season. The director of the outsourcing company, Glenn, asked Victor to meet in private about how to proceed.<\/p><p>Though there are openings with a second client, Glenn orders Victor not to tell the seasonal hires about this. Glenn’s justification for this is a fear of giving the temps false hope, they may not meet the stricter hiring policies of the second client. Victor does not feel that this is an ethical choice, as he feels that knowing that they may have a chance to apply to this new client would help soften the blow of their impending severance.<\/p><p>Toward the end of their conversation, Glenn asks Victor to roleplay the severance conversations. Victor finds this exercise unnecessary and off-putting, as he has countless lay-off conversations throughout his years of experience working with seasonal clients. Repeatedly throughout the roleplay exercise, Glenn frustrates Victor by stopping to give notes on what to say differently. At the end of the conversation, Glenn reveals that he recorded the conversation. Victor finds his frustration turns to humiliation as he listens to the roleplaying session again while Glenn gives additional notes on what to say.<\/p><p>When the time comes for the lay-off conversations, Victor takes each person individually into a private room to give them the news of the lay-off. Some take the news in stride, while others break down into tears. When asked directly if there are other clients that are hiring, Victor is unable to give specifics and provides vague answers.<\/p><p>After the conversations, Victor goes behind Glenn’s back and reaches out to the second client to ask if they have room for any of the fifteen seasonal hires. The client tells them that they can take on three by the end of the week provided they interview well. Victor once again goes behind Glenn’s back to ask seasonal client if Victor can let three of the fifteen temps go early if they are successfully hired by another client. They give Victor the green light to proceed.<\/p><p>Glenn discovers Victor talking to the clients without his involvement and brings Victor into his office. In his anger, Glenn threatens to fire Victor if he makes client-level decisions without Glenn’s involvement in the future. Victor explains the urgency of the situation and did not feel that Glenn was appropriately empathic to the livelihoods of his employees.<\/p><p>Three of the fifteen were ultimately hired by the other client, and the other twelve were let go with the option to be hired back if another client had an opening. The relationship between Victor and Glenn became strained, eroding away the trust one another had.<\/p>", "questions": "<ol><li>Victor chose between competing values: obeying the orders of his director or doing what he felt was right by his staff. How could Victor have handled this in a way that appealed to both parties?<\/li><li>What are some ways that Glenn could have balanced the needs of the client with the needs of the staff?<\/li><li>If you are part of Human Resources overseeing the resignations of the seasonal hires, what would your advice be for handling the lay-off conversations?<\/li><li>Do you feel that Glenn or Victor should have pushed back against the client about changing their contract terms and laying people off weeks before the original agreement?<\/li><li>Though their methods were not collaborative, where do you think Victor and Glenn both thought like a leader?<\/li><\/ol>", "note": ""}}, {"number": 22, "title": "The Block Everyone Wanted Fixed", "cohort": 4, "section": "Think Like a Leader", "topics": ["competing stakeholders", "policing", "homelessness", "political pressure"], "skills": ["Values", "Adaptive"], "compelling_question": "How should a leader respond when every stakeholder defines success differently and short-term pressure competes with long-term problem solving?", "permission": "not confirmed", "words": 542, "html": {"summary": "<p>A mid-sized police agency begins receiving complaints about ongoing issues near a local service provider that supports vulnerable populations. Tensions rise between community partners, nearby businesses, and law enforcement as expectations conflict. A newly assigned police sergeant must balance enforcement, relationships, and long-term problem solving. The situation presents difficult choices about leadership, priorities, and how to create sustainable solutions under pressure.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>At the Mayberry Police Department, the “Get It Done” unit recently took on increased responsibility for addressing quality of life concerns in a section of the city. Over several weeks, complaints began to surface from a nearby business regarding individuals loitering outside a neighboring clinic that services people experiencing homelessness. The business reported that some individuals were engaging in disruptive behavior and, at times, openly sharing drugs and engaging in public sexual acts. The businesses’ frustration grew as the financial impact of community members no longer shopping or coming to their locations was having a substantial negative impact.<\/p><p>Sergeant “Muldoon,” who oversees the specialized unit, directed his team to engage with both the business and the clinic. A meeting was held with leadership from the clinic, city code enforcement, and police representatives. During the meeting, the clinic acknowledged the concerns and stated they would reinforce rules with their clients, while also emphasizing their mission to serve individuals regardless of behavioral challenges. The clinic informed Sergeant Muldoon that the increased police presence would cause their clientele to avoid services, and that compassion, not enforcement, needed to be shows in light of business concerns.<\/p><p>Sergeant Muldoon had worked tirelessly to build relationships with the homeless population in the area and got to know many of these individuals on a first name basis. He knew this was a way in which to build trust and connect people experiencing homelessness with service providers. Sergeant Muldoon has compassion for the homeless, and on the same token, a duty to keep his team together and engaged on the overall mission of public safety.<\/p><p>Sergeant Muldoon knew his supervisors were receiving pressure from elected officials, so he needed to produce results, and he was being directed to do so. With so many competing agendas, Sergeant Muldoon knew he needed to keep his officers’ morale high and engaged, as they were also feeling the impact, and felt they continuously just, “Shuffle” people around with while everyone argues about agendas.<\/p><p>Following the meeting, officers increased their presence in the area. They conducted regular checks, contacted individuals who were loitering or camping, and coordinated with code enforcement to address abandoned vehicles and ordinance violations. Despite these efforts, complaints from the business continued and frustration grew. Community members also began questioning whether the police response was too aggressive or not effective enough.<\/p><p>Sergeant Muldoon now faced competing priorities: maintaining relationships with community partners, supporting his officers’ enforcement efforts, responding to his supervisors’ requests, respecting the mission of service providers, and responding to increasing pressure from stakeholders demanding immediate results.<\/p><p>As the situation continued, Muldoon had to decide how to move forward. Should he increase enforcement actions to address complaints more aggressively? Should he prioritize collaboration and long-term solutions with community partners, even if short-term complaints persist? Should he engage his supervisors for more resources? Or should he pursue a different strategy entirely?<\/p>", "questions": "<ol><li>What leadership approach should Sergeant Muldoon take in balancing enforcement with maintaining relationships with community partners?<\/li><li>How should a leader respond when different stakeholders have conflicting expectations and definitions of “success”?<\/li><li>What are the risks of focusing on short-term solutions versus long-term problem solving in this situation?<\/li><li>How can Sergeant Muldoon create opportunities for his team to think like leaders rather than simply respond to calls for service?<\/li><li>If you were in Muldoon’s position, what would your next step be, and why?<\/li><\/ol>", "note": ""}}];

const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };

const deck = { i: 0, order: null, flipped: false };
function deckRows() {

}
function deckView() {

function drawDeck() {
  const el = document.getElementById('deck'); if (!el) return;
  const rows = deckRows();
  if (!rows.length) { el.innerHTML = '<p class="empty">No cases feature all of the selected skills. Clear one below.</p>'; return; }
  deck.i = (deck.i + rows.length) % rows.length;

  document.getElementById('flip').onclick = () => { deck.flipped = !deck.flipped; document.getElementById('flip').classList.toggle('on', deck.flipped); };

    deck.i = 0; deck.flipped = false; drawDeck();
  };
}
function deckMove(d) { deck.i += d; deck.flipped = false; drawDeck(); }
addEventListener('keydown', e => {

/* ----- 7. Map ----- */
const RING = ['Process', 'Adaptive', 'Values', 'Uncertainty', 'Triggers', 'Outward'];
const MAPLABEL = {
  Triggers: ['Strengths, vulnerabilities', 'and triggers'], Uncertainty: ['Uncertainty', 'and conflict'], Outward: ['Shift focus', 'outward'],
  Values: ['Competing', 'values'], Adaptive: ['Technical', 'vs. adaptive'], Process: ['The process', 'challenge']
};
const MAPHELP = `<div class="num">How to read the map</div>
  <p>Each numbered dot is a case, placed between the skills it features. Select a dot to see its question.</p>
  <p>Select a skill to fade the cases that don't feature it.</p>`;
let mapSel = null;
function skillPos(s) {
  const a = (-90 + RING.indexOf(s) * 60) * Math.PI / 180;
  return { x: 450 + 215 * Math.cos(a), y: 320 + 215 * Math.sin(a), cos: Math.cos(a), sin: Math.sin(a) };
}
function mapView() {
  customHome('<div class="mapwrap"><div id="map"></div><aside id="mapinfo"></aside></div>', drawMap);
  drawMap();
}
function drawMap() {
  const el = document.getElementById('map'); if (!el) return;
  const groups = {};
  CASES.forEach(c => { const k = [...c.skills].sort().join('+'); (groups[k] = groups[k] || []).push(c); });
  const pts = {};
  Object.values(groups).forEach(g => g.forEach((c, j) => {
    const ps = c.skills.map(skillPos);
    let x = ps.reduce((t, p) => t + p.x, 0) / ps.length, y = ps.reduce((t, p) => t + p.y, 0) / ps.length;
    if (g.length > 1) { const r = 14 + 5 * g.length, a = 2 * Math.PI * j / g.length + Math.PI / 4; x += r * Math.cos(a); y += r * Math.sin(a); }
    pts[c.number] = { x, y };
  }));
  const active = new Set(bySkills().map(c => c.number));
  let lines = '', dots = '', nodes = '';
  CASES.forEach(c => {
    const p = pts[c.number], dim = active.has(c.number) ? '' : ' dim';
    c.skills.forEach(s => { const k = skillPos(s);
      lines += `<line class="ln${dim}" data-n="${c.number}" x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${k.x.toFixed(1)}" y2="${k.y.toFixed(1)}"/>`; });
    dots += `<g class="dot${dim}" data-n="${c.number}" tabindex="0" role="button" aria-label="Case ${c.number}: ${esc(c.title)}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="12"/><text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}">${c.number}</text></g>`;
  });
  RING.forEach(s => {
    const k = skillPos(s), anchor = k.cos > .3 ? 'start' : k.cos < -.3 ? 'end' : 'middle';
    const lx = k.x + 40 * k.cos, ly = k.y + 40 * k.sin + (k.sin < -.5 ? -14 : k.sin > .5 ? 12 : -4);
    nodes += `<g class="sk" data-s="${s}" tabindex="0" role="button" aria-pressed="${state.skills.has(s)}" aria-label="${esc(SKILLS[s])}">
      <circle cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="24" fill="var(--${s})"/>
      <text text-anchor="${anchor}"><tspan x="${lx.toFixed(1)}" y="${ly.toFixed(1)}">${MAPLABEL[s][0]}</tspan><tspan x="${lx.toFixed(1)}" dy="18">${MAPLABEL[s][1]}</tspan></text></g>`;
  });
  el.innerHTML = `<svg viewBox="0 0 900 640" role="group" aria-label="Map of cases by leadership skill">${lines}${nodes}${dots}</svg>`;
  const pick = t => {
    const d = t.closest('.dot'), k = t.closest('.sk');
    if (d) mapSelect(+d.dataset.n);
    else if (k) { const s = k.dataset.s; state.skills.has(s) ? state.skills.delete(s) : state.skills.add(s);
      const b = document.querySelector(`#skills [data-s=${s}]`); if (b) b.setAttribute('aria-pressed', state.skills.has(s)); drawMap(); }
  };
  el.onclick = e => pick(e.target);
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target); } };
  el.onmouseover = e => { const d = e.target.closest('.dot'); if (d) mapSelect(+d.dataset.n); };
  mapSelect(mapSel);
}
function mapSelect(n) {
  const c = CASES.find(x => x.number === n), info = document.getElementById('mapinfo');
  mapSel = c ? n : null;
  document.querySelectorAll('#map .ln').forEach(l => l.classList.toggle('on', +l.dataset.n === mapSel));
  document.querySelectorAll('#map .dot').forEach(d => d.classList.toggle('sel', +d.dataset.n === mapSel));
  info.innerHTML = c ? `<div class="top"><div class="num">Case ${c.number}</div><div class="time">${mins(c)}</div></div><h2>${esc(c.title)}</h2>
    <div class="chips">${c.skills.map(chip).join('')}</div><p class="q">${esc(c.compelling_question)}</p>
    <div class="meta">${esc(c.topics.join(' · '))}</div><a class="open" href="#/case/${c.number}">Read this case &rarr;</a>` : MAPHELP;
}
