    <h3>The table</h3>
    <p>The table sits above the first heading and holds the details that the home page and the skill filter run on.</p>
    <div class="tablewrap"><table>
      <tr><th>Row</th><th>Who fills it in</th></tr>
      <tr><td>Title</td><td>The student, and the group may edit it</td></tr>
      <tr><td>Compelling question</td><td>The student or the group</td></tr>
      <tr><td>Skills</td><td>The group, by deleting the ones that don't apply from the six listed in the template</td></tr>
      <tr><td>Topics</td><td>The group</td></tr>
      <tr><td>Byline</td><td>The student, as a name or "anonymous"</td></tr>
      <tr><td>Permission</td><td>The student, starting with Yes</td></tr>
    </table></div>
    <h3>The three headings</h3>
    <p>The headings are Summary, The Case and Questions, and they have to be spelled the same way in every case. Each one has to be set as a heading in the Google Docs style menu, such as Heading 1 or Heading 2. Any heading level works, but a line of normal text made big and bold does not count. No other line in the document should use a heading style, so the title goes in the table and not above it. The directions are the same for every case, so the site adds them and they stay out of the template. The site also counts the read time.</p>
    <p>Plain paragraphs, bold, italics and lists carry over from the document. Images, text boxes, columns and footnotes do not.</p>
    <h3>What keeps a case off the site</h3>
    <p>A case is held back if a heading is renamed, a skill is not one of the six, a table row is empty, placeholder text is left in, or the permission line does not start with Yes. The site names the document and the problem in a bar at the top until it is fixed.</p>
    <p>A document whose name starts with "Case Study Template" is skipped without a message. That keeps the blank template off the site if it is ever dropped into Published, and it is why each case has to be saved under its own name.</p>`],
  ['Where would it live, and who could read it?', `
    <p>In one Google account that belongs to the program. That account holds the Case Studies folder and a small script. The script is the website: opening its address shows the site with every case that is in Published. There is no separate web hosting and nothing to pay for.</p>
    <p>We tested this on two kinds of account.</p>
    <div class="tablewrap"><table>
      <tr><th>Account</th><th>Who can read the site</th><th>Result</th></tr>
      <tr><td>A regular Gmail account</td><td>Anyone who has the address, with no sign-in</td><td>Works. This is the one that reaches alumni</td></tr>
      <tr><td>A Chemeketa student account</td><td>Only people signed in to a current Chemeketa account</td><td>Works, but the college's settings allow nothing wider, so alumni lose the site when their logins close</td></tr>
    </table></div>
    <p>Recommendation: Marg creates a Gmail account for the program, and the folder and the script live there. Anyone who has the address could then read the site. The address is not published anywhere unless we publish it.</p>
    <h3>What comes with a program Gmail account</h3>
    <ul>
      <li>The account has to be handed on, so its recovery email and phone should belong to the program and not to one person.</li>
      <li>Google closes an account that nobody has signed in to for two years. Signing in once a year to add cases covers that.</li>
      <li>The account is outside the college's systems, so Marg may need to check that student work can be kept there.</li>
      <li>Google puts a gray bar across the top that reads "This application was created by a Google Apps Script user". Readers can close it, but we can't remove it.</li>
      <li>The address is long. A link from a program page, or a short link, would make it easier to pass along.</li>
    </ul>`],
  ['What about permission?', `
    <ul>
      <li>The permission statement we already require is the last row of the template table. It should name the website and say that anyone who has the address can read it, not only a book.</li>
      <li>The statement should also say that the group may edit titles and questions.</li>
      <li>Each author chooses a byline or stays anonymous.</li>
      <li>An author can't give permission for a coworker or an employer, so an editor still has to check that nobody in the story can be identified.</li>
      <li>The examples leave out two cohort four cases that were first-person and sensitive.</li>
    </ul>`],
  ['Why not Google Sites or the college website?', `
    <p>Google Sites looks like the simpler choice because it has no script. Our four-case prototype showed that it is more work and gives readers less.</p>
    <ul>
      <li>Every case is its own page that someone builds by hand: the compelling question, the skills, the topics, the case text, the questions, and the links to the previous and next case.</li>
      <li>A plain Google Site has no way to filter cases by skill, search them or sort them. The home page would be a list of links.</li>
      <li>The prototype does have a skill filter, but only because we put a block of code on its home page. That code holds its own list of the cases, and someone has to edit the code by hand every time a case is added or changed.</li>
      <li>Keeping that code working takes more technical comfort than the script version does. With the script, editors only ever work in Google Docs, and the filter, search and read times take care of themselves.</li>
      <li>Links between pages are made one at a time, by hand.</li>
    </ul>
    <p>The prototype is still up for comparison: <a href="https://sites.google.com/view/bas-case-study-prototype" target="_blank" rel="noopener">Google Sites prototype</a>.</p>
    <p>A page on the college's website or the library's would be the most permanent home. It is also the slowest to arrange, and the college sets the rules for what goes on it.</p>`],
  ['What does setup take?', `
    <p>About 15 minutes, once, by whoever will own the account. It takes a computer with a web browser and a phone that can receive a text from Google. Nothing is installed and nothing is paid for.</p>
    <p>Our group hands over three things to do it with: the case template, and the two files that make up the script, which are called Code.gs and Site.html.</p>
    <h3>Part 1: Create the account</h3>
    <ol>
      <li>Go to accounts.google.com, choose Create account, and pick the option for personal use.</li>
      <li>Google asks for a name, a birthday and the Gmail address you want. Use a name that says what the account is for, such as "Chemeketa BAS Case Studies". Google says right away if the address is already taken.</li>
      <li>Choose a password and store it wherever the program keeps shared passwords.</li>
      <li>When Google asks for a phone number and a recovery email, use ones that belong to the program or the office. Whoever holds them is the only person who can get back in if the password is lost.</li>
    </ol>
    <h3>Part 2: Make the folder</h3>
    <ol>
      <li>While signed in to the new account, open drive.google.com. Click New, then New folder, and name it "Case Studies".</li>
      <li>Open the Case Studies folder and make two more folders inside it, named "Published" and "In review".</li>
