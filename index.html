<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Think Like a Leader Case Studies</title>
<style>
/* ---------- shared structure ---------- */
body {
  --bg: #ffffff; --surface: #ffffff; --text: #16181d; --muted: #5d6470; --line: #d9dce2; --accent: #1b3a6b; --on-accent: #ffffff;
  --head-bg: var(--surface); --head-text: var(--text);
  --font-body: Georgia, "Times New Roman", serif; --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif; --font-head: var(--font-body);
  --radius: 6px; --head-weight: 700;
  --Triggers: #b3261e; --Uncertainty: #b45309; --Outward: #7d6200; --Values: #1f7a3d; --Adaptive: #1d5fbf; --Process: #6b3fb5;
  margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--font-body);
}
* { box-sizing: border-box; }
h1, h2, h3, summary, .q, .bigq, .btitle { text-wrap: balance; }
p, li, td, .skill span, .meta, small { text-wrap: pretty; }
.ui, button, input, select, .chip, .meta, .num, nav, .sub, .banner, .picker, .hint, .count, .back, summary { font-family: var(--font-ui); }
h1, h2 { font-family: var(--font-head); font-weight: var(--head-weight); }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px; }
header { background: var(--head-bg); color: var(--head-text); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-top: 18px; padding-bottom: 14px; }
header a { color: inherit; text-decoration: none; }
header h1 { margin: 0; font-size: 1.55rem; line-height: 1.2; }
.sub { opacity: .8; font-size: .9rem; margin-top: 3px; }
.picker { font-size: .85rem; display: flex; align-items: center; gap: 8px; }
.banner { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); border-bottom: 1px solid var(--line); font-size: .84rem; padding: 7px 0; }
main { padding: 24px 0 64px; }
input[type=search], select { font-size: .95rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
.intro h2 { margin: 0 0 6px; font-size: 1.2rem; }
.intro p { margin: 8px 0; }
.intro ul { margin: 6px 0 10px; padding-left: 22px; }
.hint { color: var(--muted); font-size: .85rem; margin: 10px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { --c: var(--muted); display: inline-block; font-size: .76rem; font-weight: 600; line-height: 1.3; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); text-align: left; }
button.chip { cursor: pointer; font-size: .86rem; padding: 6px 13px; }
button.chip[aria-pressed=true] { background: var(--c); color: var(--bg); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls input { flex: 1 1 240px; min-width: 0; }
.count { color: var(--muted); font-size: .9rem; margin: 12px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; color: inherit; text-decoration: none; }
.card:hover, .card:focus-visible { border-color: var(--accent); }
.card h2 { margin: 0; font-size: 1.15rem; line-height: 1.25; }
.num, .meta { color: var(--muted); font-size: .82rem; }
.card .q { margin: 4px 0 0; font-style: italic; font-size: .96rem; line-height: 1.45; }
.card .meta { margin-top: auto; }
article { display: grid; grid-template-columns: minmax(0, 1fr) 270px; column-gap: 56px; align-items: start; }
.a-head { grid-column: 1 / -1; }
.a-main { grid-column: 1; grid-row: 2; font-size: 1.06rem; }
.a-main > h2:first-child { margin-top: 20px; }
.a-side { grid-column: 2; grid-row: 2; position: sticky; top: 20px; margin-top: 20px; padding-left: 22px; border-left: 1px solid var(--line); }
.a-side h3 { font-family: var(--font-ui); font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; }
.a-side h3:first-child { margin-top: 0; }
article .a-side .q { font-size: 1.08rem; line-height: 1.45; border: 0; padding: 0; margin: 0; }
.a-side .chips { flex-direction: column; align-items: flex-start; }
body[data-design="2"] .a-side { top: 96px; }
@media (max-width: 900px) {
  article { display: block; }
  .a-side { position: static; border-left: 0; padding: 14px 0; margin: 12px 0 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
}
@media print { article { display: block; } }
article h1 { font-size: 2rem; line-height: 1.15; margin: 6px 0 12px; }
article h2 { font-size: 1.2rem; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
article .q { font-style: italic; font-size: 1.15rem; border-left: 3px solid var(--accent); margin: 16px 0; padding: 2px 0 2px 14px; }
article li { margin-bottom: 8px; }
details { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 24px 0; background: var(--surface); }
summary { cursor: pointer; font-weight: 600; font-size: .95rem; }
nav.pn { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; font-size: .92rem; }
a { color: var(--accent); }
.back { font-size: .92rem; }
.empty { color: var(--muted); padding: 32px 0; }
.hnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.howlink { font-family: var(--font-ui); font-size: .9rem; font-weight: 600; text-decoration: underline !important; }
.banner a { color: inherit; font-weight: 600; margin-left: 6px; }
.about { max-width: 820px; }
.about h1 { font-size: 2rem; line-height: 1.15; margin: 6px 0 8px; }
.about h2 { font-size: 1.3rem; margin: 36px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.about h3 { font-family: var(--font-ui); font-size: .95rem; margin: 20px 0 6px; }
.about li { margin-bottom: 6px; }
.about figure { margin: 18px 0; }
.about figure img { display: block; width: 100%; max-width: 640px; height: auto; border: 1px solid var(--line); }
.about figcaption { font-family: var(--font-ui); font-size: .85rem; color: var(--muted); margin-top: 6px; }
.about .lede { font-size: 1.1rem; color: var(--muted); margin: 0 0 8px; }
.about .tablewrap { overflow-x: auto; margin: 14px 0; }
.about table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .94rem; }
.about th, .about td { text-align: left; vertical-align: top; padding: 10px 12px; border: 1px solid var(--line); }
.about th { font-family: var(--font-ui); font-size: .82rem; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.about td { background: var(--surface); }
.about .toc { font-family: var(--font-ui); font-size: .92rem; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin: 18px 0 0; }
.about .toc button { display: block; font: inherit; background: none; border: 0; padding: 2px 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }
body[data-design="6"] .about { background: #fff; padding: 28px clamp(18px, 4vw, 44px); border-radius: 20px; }
@media print { .sub, .banner, nav, .back, .controls, .picker { display: none; } details { border: 0; padding: 0; } }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.time { font-family: var(--font-ui); font-size: .76rem; font-weight: 600; color: inherit; border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px; white-space: nowrap; opacity: .85; }
details.intro { margin: 0 0 20px; padding: 16px 20px; }
details.intro > summary { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 1.25rem; }
.intro .lead { font-size: 1.05rem; margin: 12px 0 16px; }
.intro .row { display: grid; grid-template-columns: 210px minmax(0, 1fr); column-gap: 36px; row-gap: 10px; padding: 18px 0; border-top: 1px solid var(--line); }
.intro .row:last-child { padding-bottom: 4px; }
.intro h3 { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 1.05rem; line-height: 1.3; margin: 0; color: var(--text); }
.intro h3 small { display: block; font-family: var(--font-ui); font-weight: 400; font-size: .82rem; line-height: 1.45; color: var(--muted); margin-top: 8px; }
.intro .comp, .intro .steps { margin: 0; padding: 0; list-style: none; counter-reset: st; }
.intro .comp li, .intro .steps li { margin: 0 0 8px; font-size: .97rem; line-height: 1.5; }
.intro .comp strong, .intro .steps strong { display: block; }
.intro .comp li, .intro .steps li { margin-bottom: 12px; }
.intro .row li:last-child { margin-bottom: 0; }
.intro .steps li { counter-increment: st; }
.intro .steps strong::before { content: counter(st) ". "; }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.skill { --c: var(--muted); display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 10px; align-content: start; text-align: left; font: inherit; cursor: pointer;
  color: var(--text); background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: var(--radius); padding: 10px 12px; }
.skill::before { content: ""; grid-row: 1 / span 2; width: 16px; height: 16px; margin-top: 4px; border: 2px solid var(--c); border-radius: 3px; box-sizing: border-box; }
.skill b { grid-column: 2; font-size: .97rem; line-height: 1.35; }
.skill span { grid-column: 2; font-size: .86rem; line-height: 1.45; color: var(--muted); margin-top: 2px; }
.skill:hover { border-color: var(--c); }
.skill[aria-pressed=true] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.skill[aria-pressed=true]::before { background: var(--c); box-shadow: inset 0 0 0 2px var(--surface); }
@media (max-width: 760px) { .intro .row { grid-template-columns: 1fr; } }

/* ---------- 1. Journal: white page, serif, ruled list ---------- */
body[data-design="1"] header { border-bottom: 3px double var(--text); }
body[data-design="1"] header h1 { font-size: 1.9rem; font-weight: 400; letter-spacing: .01em; }
body[data-design="1"] details.intro { padding: 16px 0; max-width: none; }
body[data-design="1"] .intro { border: 0; border-top: 1px solid var(--text); border-bottom: 1px solid var(--text); border-radius: 0; padding: 16px 0; }
body[data-design="1"] .grid { grid-template-columns: 1fr; gap: 0; max-width: 820px; }
body[data-design="1"] .card .top { grid-column: 1; grid-row: 1 / span 4; display: block; }
body[data-design="1"] .card .time { display: block; border: 0; padding: 0; margin-top: 8px; font-weight: 400; }
body[data-design="1"] .card { display: grid; grid-template-columns: 92px 1fr; column-gap: 12px; row-gap: 6px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 18px 0; }
body[data-design="1"] .card > * { grid-column: 2; }
body[data-design="1"] .card .num { grid-column: 1; grid-row: 1 / span 4; font-family: var(--font-body); font-size: 1.7rem; color: var(--accent); line-height: 1; }
body[data-design="1"] .card .num span { display: none; }
body[data-design="1"] .card:hover h2 { text-decoration: underline; }
body[data-design="1"] .chip { border: 0; background: none; padding: 0 12px 0 0; border-radius: 0; text-transform: uppercase; letter-spacing: .05em; font-size: .7rem; }
body[data-design="1"] button.chip { padding: 5px 10px; border: 1px solid var(--c); font-size: .74rem; }
body[data-design="1"] .controls, body[data-design="1"] .count { max-width: 820px; }

/* ---------- 2. Modern: soft gray, sans, floating cards ---------- */
body[data-design="2"] {
  --bg: #f3f4f8; --surface: #ffffff; --text: #1c1f2b; --muted: #636a7d; --line: #e3e6ee; --accent: #4f46e5;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --radius: 14px; --head-weight: 650;
}
body[data-design="2"] header { position: sticky; top: 0; z-index: 2; }
body[data-design="2"] .card, body[data-design="2"] .intro { border-color: transparent; box-shadow: 0 1px 2px rgba(20,24,40,.06), 0 6px 18px rgba(20,24,40,.06); }
body[data-design="2"] .card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,24,40,.08), 0 12px 28px rgba(79,70,229,.16); }
body[data-design="2"] .card { transition: transform .12s, box-shadow .12s; padding: 20px; }
body[data-design="2"] .card .q { font-style: normal; color: var(--muted); }
body[data-design="2"] .chip { border-color: transparent; background: color-mix(in srgb, var(--c) 13%, transparent); }
body[data-design="2"] article .q { font-style: normal; font-weight: 500; }

/* ---------- 3. Night: dark, teal accent ---------- */
body[data-design="3"] {
  --bg: #10151c; --surface: #18202a; --text: #e6ebf2; --muted: #93a0b2; --line: #2a3542; --accent: #3fd0c0; --on-accent: #06231f;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --radius: 4px; --head-weight: 600;
  --Triggers: #ff8f86; --Uncertainty: #ffab5e; --Outward: #e6c84f; --Values: #6fd893; --Adaptive: #7db4ff; --Process: #c0a2ff;
}
body[data-design="3"] header h1 { letter-spacing: .02em; }
body[data-design="3"] .card { border-left: 4px solid var(--accent); }
body[data-design="3"] .card:hover { background: #1d2733; }
body[data-design="3"] .chip { background: transparent; }
body[data-design="3"] .intro { border-left: 4px solid var(--accent); }

/* ---------- 4. Poster: black, white and yellow, hard edges ---------- */
body[data-design="4"] {
  --bg: #ffffff; --surface: #ffffff; --text: #000000; --muted: #3d3d3d; --line: #000000; --accent: #000000;
  --head-bg: #ffd400; --head-text: #000000;
  --font-body: "Helvetica Neue", Arial, sans-serif; --font-head: "Arial Black", "Helvetica Neue", Arial, sans-serif; --radius: 0; --head-weight: 900;
  --Triggers: #c2261c; --Uncertainty: #b84a00; --Outward: #6f5a00; --Values: #17703a; --Adaptive: #1552b8; --Process: #6232b0;
}
body[data-design="4"] header { border-bottom: 3px solid #000; }
body[data-design="4"] header h1 { text-transform: uppercase; font-size: 1.7rem; letter-spacing: -.01em; }
body[data-design="4"] .banner { background: #000; color: #fff; }
body[data-design="4"] .card, body[data-design="4"] .intro, body[data-design="4"] details, body[data-design="4"] input, body[data-design="4"] select { border: 2px solid #000; }
body[data-design="4"] .card:hover { box-shadow: 6px 6px 0 #000; transform: translate(-2px, -2px); }
body[data-design="4"] .card h2 { text-transform: uppercase; font-size: 1.05rem; }
body[data-design="4"] .card .q, body[data-design="4"] article .q { font-style: normal; }
body[data-design="4"] .time { border: 2px solid #000; border-radius: 0; background: #ffd400; color: #000; opacity: 1; }
body[data-design="4"] .skill { border: 2px solid #000; border-left: 8px solid var(--c); }
body[data-design="4"] .chip { border-radius: 0; background: var(--c); color: #fff; border-color: var(--c); }
body[data-design="4"] button.chip { background: #fff; color: var(--c); border-width: 2px; }
body[data-design="4"] button.chip[aria-pressed=true] { background: var(--c); color: #fff; }
body[data-design="4"] article h1 { text-transform: uppercase; }
body[data-design="4"] article h2 { border-top: 3px solid #000; }
body[data-design="4"] article .q { border-left: 8px solid #ffd400; font-weight: 700; }

/* ---------- 5. Catalog: sage green, rounded, table-style rows ---------- */
body[data-design="5"] {
  --bg: #eef3ee; --surface: #ffffff; --text: #1e2b24; --muted: #5a6b61; --line: #cfdcd2; --accent: #2f6f57;
  --head-bg: #2f6f57; --head-text: #ffffff;
  --font-body: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; --radius: 10px; --head-weight: 700;
}
body[data-design="5"] header { border-bottom: 0; }
body[data-design="5"] .grid { grid-template-columns: 1fr; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
body[data-design="5"] .card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 18px; }
body[data-design="5"] .card:last-child { border-bottom: 0; }
body[data-design="5"] .card:hover { background: #f4f8f4; }
body[data-design="5"] .card .q { font-size: .9rem; }
@media (min-width: 860px) {
  body[data-design="5"] .card .top { grid-column: 1; grid-row: 1 / span 2; display: block; }
  body[data-design="5"] .card .time { display: inline-block; margin-top: 6px; }
  body[data-design="5"] .card { display: grid; grid-template-columns: 104px minmax(0, 1.5fr) minmax(0, 1fr) 190px; column-gap: 18px; row-gap: 4px; align-items: start; }
  body[data-design="5"] .card .num { grid-column: 1; grid-row: 1 / span 2; }
  body[data-design="5"] .card h2 { grid-column: 2; }
  body[data-design="5"] .card .q { grid-column: 2; grid-row: 2; margin: 0; }
  body[data-design="5"] .card .chips { grid-column: 3; grid-row: 1 / span 2; flex-direction: column; align-items: flex-start; }
  body[data-design="5"] .card .meta { grid-column: 4; grid-row: 1 / span 2; margin: 0; }
}

/* ---------- 6. Deck: one question at a time on a card you flip ---------- */
body[data-design="6"] {
  --bg: #ffffff; --surface: #ffffff; --text: #1d1330; --muted: #6a5f7c; --line: #e6dfee; --accent: #c7305f;
  --head-bg: transparent; --head-text: #ffffff;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --font-head: Georgia, "Times New Roman", serif; --radius: 16px;
  background: linear-gradient(135deg, #2b1055 0%, #c7305f 62%, #ff9a3c 100%) fixed;
}
body[data-design="6"] header { border-bottom: 1px solid rgba(255,255,255,.3); }
body[data-design="6"] .banner { background: rgba(0,0,0,.28); color: #fff; border: 0; }
body[data-design="6"] article { background: #fff; padding: 28px clamp(18px, 4vw, 44px); border-radius: 20px; }
body[data-design="6"] .intro { margin-top: 28px; border: 0; }
.deck { max-width: 700px; margin: 0 auto; color: #fff; font-family: var(--font-ui); }
.deck-count { text-align: center; font-size: .9rem; opacity: .9; margin-bottom: 12px; letter-spacing: .04em; }
.flip { display: block; width: 100%; border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; perspective: 1400px; }
.flip .inner { display: grid; transition: transform .55s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.flip .face { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 16px; min-height: 340px; padding: clamp(22px, 5vw, 40px); border-radius: 24px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 24px 60px rgba(20, 6, 40, .45); }
.flip .front { background: #fff; color: #1d1330; }
.flip .back { background: #1d1330; color: #fff; transform: rotateY(180deg); }
.flip .kicker { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; opacity: .7; }
.flip .bigq { font-family: var(--font-head); font-size: clamp(1.35rem, 3.6vw, 2.05rem); line-height: 1.25; }
.flip .btitle { font-family: var(--font-head); font-size: clamp(1.4rem, 3.4vw, 1.9rem); line-height: 1.2; }
.flip .bsum { font-size: .95rem; line-height: 1.5; opacity: .9; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.flip .tap { margin-top: auto; font-size: .82rem; opacity: .65; }
.flip:focus-visible .face { outline: 3px solid #ffd166; outline-offset: 3px; }
.deck-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
.deck-btns button, .deck-btns a { font: 600 .95rem var(--font-ui); padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.6);
  background: rgba(255,255,255,.14); color: #fff; cursor: pointer; text-decoration: none; }
.deck-btns a { background: #fff; color: #1d1330; border-color: #fff; }
.deck-btns button:hover { background: rgba(255,255,255,.28); }
.deck .empty { color: #fff; text-align: center; }
@media (prefers-reduced-motion: reduce) { .flip .inner { transition: none; } }

/* ---------- 7. Map: cases plotted between the skills they feature ---------- */
.mapwrap { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(250px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .mapwrap { grid-template-columns: 1fr; } }
#map { overflow-x: auto; }
#map svg { display: block; width: 100%; min-width: 620px; height: auto; font-family: var(--font-ui); }
#map .ln { stroke: color-mix(in srgb, var(--text) 22%, transparent); stroke-width: 1; }
#map .ln.on { stroke: var(--accent); stroke-width: 2.5; }
#map .sk { cursor: pointer; }
#map .sk text { fill: var(--text); font-size: 15px; }
#map .sk circle { stroke: transparent; stroke-width: 5; }
#map .sk[aria-pressed=true] circle { stroke: var(--text); }
#map .dot { cursor: pointer; }
#map .dot circle { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }
#map .dot text { fill: var(--text); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#map .dot.sel circle { fill: var(--accent); }

<script>
const CASES = [{"number": 1, "title": "The Successor Nobody Was Ready For", "cohort": 4, "section": "Think Like a Leader", "topics": ["leadership transition", "hiring and promotion", "favoritism"], "skills": ["Adaptive", "Process"], "compelling_question": "What should leaders diagnose before changing people and reporting relationships in a department already struggling with trust?", "permission": "not confirmed", "words": 869, "html": {"summary": "<p>A mid-sized college, nationally recognized for employee longevity and satisfaction, had an Academic Affairs office of two dozen long-tenured and tight-knit staff members who often socialized outside of work. When the long-time director, Helen, had retired, the college asked the director of a neighboring department, Marian, to temporarily assume Helen’s responsibilities in addition to her own. Due to economic challenges, Marian hesitated to accept this new appointment but felt compelled to do so. The computer analyst, Paige, is also appointed to a supervisory role, which causes angst. The Academic Affairs department becomes a hostile work environment, so the vice president, Walter, tries to appoint leaders and shift roles to fix the issues.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>In one college department, staff members adored Helen as their leader and were doubtful that anyone could fill her shoes. Six months before Helen’s retirement, a tech-savvy young computer analyst named Paige was hired and began working in the Academic Affairs department. Marian, a dean of the neighboring department, was already managing a full workload and could not assume all the responsibilities of the former director when she was asked. As a result, the college promoted Paige to perform day-to-day operations, while Marian was appointed to supervise Paige and remained the overall supervisor for employees in both departments.<\/p><p>The office consisted mostly of mature ladies who had concerns about a much younger person being promoted to their leader. Because of her age, a few social mishaps, and her inexperience in leadership, Paige offended and upset several staff members.  This caused growing outrage from the Academic Affairs staff members, as they were highly protective of their coworkers. Paige’s personality and work style were opposite to that of the former director, Helen. Paige was not welcomed into the tight-knit inner circle by the staff members who had held Helen in such high esteem.<\/p><p>The team entertained side conversations at work, via email, and outside of work in their social circles, with topics revolving around the new management. All this fueled their angst. Complaints began to pour in regularly to Marian in the form of emails and private in-person complaint sessions, claiming Paige’s promotion was a mistake. Marian regretted accepting this extra assignment. Complaints began reaching Walter, who was the vice president supervising these departments. Following a series of escalating complaints, Walter recognized the need for potential personnel changes to resolve the issues.<\/p><p>After several meetings with upset staff, Walter concluded that Paige lacked the supervisory skills needed for the role. He wanted to find someone like Vivian, a college graduate from his social circles, whom he knew outside the college. Vivian had impressed him.  He thought what the department needed was a new person with a bright and charming personality to help everyone get along. Walter promptly created an entry-level role within the struggling department and coordinated with Human Resources to post it publicly for a brief period. This allowed Walter to select Vivian for the position. There were fewer requirements for hiring a part-time employee.<\/p><p>Walter went to work creating a supervisory position to submit to HR that would oversee five staff members within this department.  His plan would give Vivian time as a supervisor in the department, and later, he would be able to appoint her to the department dean down the road.<\/p><p>Vivian applied and was hired for the part-time entry-level position. She accrued more than six months of experience before the supervisory position was posted. The new supervisory position requires that all applicants be existing employees of that department. In addition, the bachelor’s degree requirement excluded most interested employees in the department. The position was only posted for one week before it closed.  Vivian was hired and reported to Marian.<\/p><p>As tensions rose and staff increasingly resisted Paige’s leadership, the department gradually became a hostile work environment. Vivian was instrumental in eventually pushing Walter to reassign Paige to another department, so Vivian could be the sole supervisor in charge. Under pressure from Vivian and other staff, Walter reassigned Paige and appointed Vivian as dean, with Vivian now reporting directly to him instead of Marian.<\/p><p>Upon Vivian’s initial hire, she proved to be very charming, welcoming, and warm to all the college administration. She was flirtatious and socially savvy.  She winked and hugged those who held important roles. When she believed she was being watched, she also displayed this behavior toward low-level employees. However, away from the public eye, staff members in her department soon learned that Vivian was an aggressive bully.<\/p><p>Vivian was calculating and manipulative, and when staff who witnessed her behavior reported it to HR, she retaliated by putting them on performance plans. At day’s end, Vivian would scour employees’ notebooks and paperwork, meticulously documenting even the tiniest mistakes. Her plan included incorporating a few of the young new hires whom she showered with attention and gifts, and in return, asked them to help with her spying.<\/p><p>Vivian strategically aligned with Marian to secure her promotion, only to abandon the relationship once it no longer offered leverage. Vivian spent considerable time with Denise, the Human Resources director. Vivian and Denise became fitness and jogging partners. Over time, all staff members resigned or retired early, resulting in two complete staff turnovers in the department.<\/p>", "questions": "<ol><li>What are the initial core problems and opportunities facing the Academic Affairs department?<\/li><li>What examples can you see of Walter effectively thinking like a leader?<\/li><li>Can you identify instances where Walter’s actions suggest he struggled to demonstrate effective leadership thinking?<\/li><li>What questions would you like to ask Marian, Denise, and Walter before giving advice?<\/li><li>If you brought in an advisory board after Paige and Marian were installed in their new roles, what would be the goal of the advisory board in thinking like a leader?<\/li><\/ol>", "note": ""}}, {"number": 2, "title": "When Change Becomes the Strategy", "cohort": 4, "section": "Think Like a Leader", "topics": ["new leader", "change management", "turnover", "professional autonomy"], "skills": ["Adaptive", "Process"], "compelling_question": "How can a new leader change an effective team without losing the knowledge, trust, and professional judgment that made it successful?", "permission": "not confirmed", "words": 509, "html": {"summary": "<p>A well functioning HR Team goes through an HR Director transition. The team had about 17 members and were structured in five sub-groups: recruitment, classification, data processing, payroll and HR consultation. The new HR Director brings upon the team changes to processes and procedures impacting not only the team dynamics but the team’s relationship with the agency executives, managers and supervisors.<\/p>", "directions": "<p>As you read this case study consider the concept of Think Like a Leader. When doing this a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies.<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision.<\/li><li>Identify and describe personal leadership styles, characteristics, strengths and philosophy.<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strength, vulnerabilities and triggers.<\/li><li>Get used to uncertainty and conflict.<\/li><li>Understand yourself but also be able to shift focus outward.<\/li><li>Choose among competing values.<\/li><li>Distinguish between technical and adaptive.<\/li><li>Understand the process challenge.<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>The new HR Director at Konkiki Agency, hired after the previous successful director was moved to a bigger size agency, initially met with the HR team, expressing confidence in their abilities and promising to learn about their work and challenges to offer support. This HR Team was a successful and well-functioning team.<\/p><p>Over six months, the new HR Director met with sub-teams. She made minor adjustments for Data Processors and Payroll, whose procedures were system-driven. However, for Recruitment, she completely replaced their existing, effective procedures and forms without addressing their expressed challenges, suggesting a pre-set agenda. When meeting with Classification, she immediately imposed new forms and procedures without inquiring about their current processes, procedures and forms.<\/p><p>Simultaneously, she held weekly meetings with the Strategic HR Consultants, praising their work and reliance on them, and reporting success with the sub-team meetings. Around month 5-6, she announced hiring a temporary \"policy/project consultant\" for policy work. Around month 7, when this temporary consultant came on board, the person was directly appointment to the temporary position and was introduced as the new Lead HR Consultant, surprising the existing HR Consultants.<\/p><p>The Director began meeting regularly with the new “Lead” HR Consultant while neglecting the HR Consultants. Staff began feeling disrespected and undervalued due to the sudden, imposed changes and the Director's perceived lack of genuine interest, leading some to seek other jobs. The HR Consultants attempted to motivate staff, advising them to adapt and address issues with the new Director.<\/p><p>When the Director finally met with the HR Consultants, she cited being busy with strategy and insisted they include the new \"Lead\" HR consultant in all their confidential cases and communication. Citing concerns about eroding confidential relationships, the HR Consultants resisted, leading the Director to institute a case tracker with brief updates.<\/p><p>The \"Lead\" HR Consultant then met individually with each of the HR Consultants, questioning them in a manner that felt like an interrogation. Two weeks later, the \"Lead\" HR Consultant provided them with a highly scripted procedure for their professional, independent roles, removing their judgment and independency and turning their strategic business partner role into a transactional one.<\/p><p>By this time, several HR members had left, including one of the HR Consultants whose vacancy was filled by the \"Lead\" HR Consultant through a permanent direct appointment. The HR Department's positive reputation and relationship with the agency had deteriorated, with customers and managers feeling their confidential matters were reduced to transactional interactions and experienced overall a lack of guidance. The two remaining HR Consultants also left a few weeks later. After only 10 months, 75% of the HR Team had departed, leaving Konkiki Agency's HR struggling with numerous vacancies and workload.<\/p>", "questions": "<ol><li>What examples can you see of thinking like a leader and from whom?<\/li><li>What examples can you see of when someone failed to effectively think like a leader and who?<\/li><li>Imagine you are brought as an advisor to the HR Director what guidance/recommendation would you provide if you were brought on:<ul><li>At the beginning, when she took the job?<\/li><li>When she started implementing changes and started seeing people unhappy or leaving, customer service failing, and seeing push back from HR Consultants?<\/li><li>At the tail end when all changes were implemented, staff had left, and she was needing to fill the vacancies, improves service and rebuild relationships with managers?<\/li><\/ul><\/li><\/ol>", "note": ""}}, {"number": 3, "title": "When Nobody Knows Whose Job It Is", "cohort": 4, "section": "Think Like a Leader", "topics": ["role clarity", "short staffing", "conflict between coworkers"], "skills": ["Uncertainty", "Process"], "compelling_question": "What should a leader do when unclear roles allow an operational disagreement to turn into a persistent professional conflict?", "permission": "not confirmed", "words": 430, "html": {"summary": "<p>A community college GED program has employed full-time faculty and several support staff, including an advisor, instructional specialist, and tutor. Due to front-office being understaffed due to a layoff, the instructional specialist, Renee, was required to cover office duties in addition to her tutoring responsibilities. While conducting routine classroom visits to explain available support services, Renee was publicly undermined and belittled by a faculty member, Curtis. The incident escalated into ongoing conflict, requiring formal mediation and administrative involvement. Although a meeting was held, the conflict remained unresolved, negatively impacting workplace communication until Renee eventually left for another job. The situation highlights challenges involving role ambiguity, communication breakdown, and leadership gaps within academic programs.<\/p>", "directions": "<p>Leaders are responsible for clarifying roles, establishing expectations, and fostering professional communication within their teams. When responsibilities shift due to staffing shortages, leaders must ensure that all team members understand the purpose and value of redistributed tasks. In conflict situations, it is essential to model emotional intelligence, address inappropriate behavior consistently, and create space for open dialogue. This scenario invites readers to examine leadership approaches to conflict resolution, the importance of organizational transparency, and how team culture impacts student success.<\/p>", "case": "<p>In a community college GED program, three faculty members worked alongside support staff whose responsibilities included advising, instructional support, and tutoring. Renee, the instructional specialist, managed a tutoring classroom and collaborated with a part-time tutor, Owen. At the start of each term, support staff visited faculty classrooms to inform students about academic support services.<\/p><p>During a period of understaffing, Renee was asked to cover front-office duties each morning before returning to her tutoring responsibilities. This arrangement ensured that students could be enrolled and supported, though it limited her physical availability in her tutoring space.<\/p><p>One day, while Renee and Owen were visiting a classroom taught by a faculty member named Curtis, conflict emerged. After Renee explained her role and expressed commitment to supporting students toward earning passing GED scores, Curtis openly contradicted her and told the class that <em>he<\/em> cared more about their success. He belittled Renee in front of students, undermining her professionalism.<\/p><p>Renee reported the incident to her supervisor after taking time to calm down. Her supervisor recommended that she meet with Curtis and bring union representatives for support. He also recommended that in the meantime take time to breath before the meeting occurred. Hoping to resolve the tension, she requested a meeting with Curtis and their supervisor. Both brought representatives for documentation and support. During the meeting, Curtis expressed frustration that Renee was covering the front office rather than staying at her desk, while Renee emphasized that onboarding new students was crucial to program success.<\/p><p>Although the meeting ended with an agreement to “cool off,” Curtis’s behavior remained dismissive and passive-aggressive. He avoided speaking to Renee directly unless necessary and continued to make her uncomfortable. Renee chose to remain professional but ultimately accepted another role outside the GED program. Reflecting later, she recognized that the conflict revealed areas where she could grow as a leader and strengthened her understanding of communication, boundaries, and self-advocacy.<\/p>", "questions": "<ol><li>How could leadership have clarified roles and responsibilities to prevent misunderstandings between faculty and support staff?<\/li><li>What leadership actions should occur when an employee publicly undermines or belittles a colleague?<\/li><li>How might a leader balance program needs (such as office coverage) with ensuring staff feel supported and respected in their primary roles?<\/li><li>What communication strategies could Renee have used, before or after the incident, to set boundaries or expectations with Curtis?<\/li><li>If you were the supervisor, how would you handle the ongoing tension after the initial conflict-resolution meeting?<\/li><\/ol>", "note": ""}}, {"number": 4, "title": "Leading Through a Moving Target", "cohort": 4, "section": "Think Like a Leader", "topics": ["organizational change", "project management", "resistance"], "skills": ["Uncertainty", "Outward", "Process"], "compelling_question": "When nearly everything around a project is changing, what should a leader stabilize first: the plan, the relationships, or the decision-making process?", "permission": "not confirmed", "words": 576, "html": {"summary": "<p>When a newly appointed Chief Shenanigans Officer brought major cultural and operational changes to the Department of Shenanigans, the Business Operations Division—responsible for financial management and strategic initiatives—had to rapidly realign its plans and projects. As priorities shifted, one of my large projects was reassigned, and I took on two new ones: a repeatedly restarted Agile software project and a vendor implementation following a Waterfall approach. The transition surfaced emotional responses and resistance, including a slow handoff from the previous Agile project manager and colleagues struggling with uncertainty. With every team member now reporting to new leadership, I focused on listening, rebuilding trust, clarifying roles, and re-establishing communication. By addressing resistance with empathy, organizing historical documentation, and balancing Agile and traditional project methods, I gradually restored alignment and kept both projects moving forward despite significant organizational upheaval.<\/p>", "directions": "<p>As you read this case study consider the concept of Think Like a Leader? When doing this a leader should be able to<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul>", "case": "<p>When a new Chief Shenanigans Officer was appointed to lead the Department of Shenanigans (DOS), the entire organization, more than 1,000 employees, experienced a major cultural and operational shift. Priorities changed almost immediately, and every department had to adjust to a new vision and leadership style.<\/p><p>The Business Operations Division (BOD), where I work, felt this impact deeply. We support the Department’s financial management, initiatives, and strategic planning, so when leadership priorities shifted, our projects and structure did too. Just a year earlier, BOD launched a new strategic plan focused on redefining our mission, vision, and leadership approach. With the arrival of new leadership, many of those plans had to be revisited and realigned.<\/p><p>As part of the transition, one medium-sized project was placed on hold, and my large-scale project—still in its initiation phase—was reassigned to two other project managers. I was given two new projects instead:<\/p><ul><li>An Agile software development project that had been restarted three times under different project managers.<\/li><li>A vendor implementation project following a more traditional Waterfall-style approach.<\/li><\/ul><p>The transition came with some unexpected challenges. The previous project manager for the Agile project was slow to hand off responsibilities and didn’t readily share project documentation or communication channels. I didn’t see this as intentional resistance; it felt more like a natural reaction to change and uncertainty.<\/p><p>At the same time, one of my colleagues, whose project had been placed on hold, shared a very emotional response with me during a one-on-one meeting. It reminded me how deeply these organizational shifts can affect people, especially when their sense of purpose or progress is disrupted.<\/p><p>Adding to the complexity, every person involved in my projects—internally and externally—is now reporting to a new manager.<\/p><p>While feeling like this change was happening to me, I re-aligned my priorities, and I focused on listening first and leading with empathy. I made it a priority to meet with each stakeholder and team member to reestablish trust, clarify roles, and open-up communication. For the Agile project, I worked to access historical documentation and create a central repository so that everyone had the same information.<\/p><p>I approached the resistance I encountered with patience rather than pressure, acknowledging how difficult change can be. I wanted to create a space for everyone to be able to share all of the things going on, and then by emphasizing shared goals and transparency. I am gradually creating alignment across teams.<\/p><p>Because I was managing one Agile and one traditional project, I also had to adapt my approach—balancing sprint cycles and retrospectives in one, while keeping structured timelines and vendor deliverables on track in the other.<\/p>", "questions": "<ol><li>What examples can you see that I was effectively thinking like a leader?<\/li><li>Imagine you are brought in as an advisor to Leadership at the beginning of this change. What questions would you like to ask before giving advice?<\/li><li>What do you think I could do better, and what should I continue doing to reach the goals of the project?<\/li><\/ol>", "note": ""}}, {"number": 5, "title": "The Event That Should Have Been Cancelled", "cohort": 4, "section": "Think Like a Leader", "topics": ["staffing", "budget authority", "escalation", "when to cancel"], "skills": ["Uncertainty", "Values", "Process"], "compelling_question": "At what point should a leader stop trying to rescue a troubled project and make the harder decision to cancel or redesign it?", "permission": "not confirmed", "words": 838, "html": {"summary": "<p>Small Nonprofit Hospice experienced challenges planning an event due to staffing changes. The departure of the Community Development Assistant led to a workload that was difficult to manage. The Fundraising and Events Coordinator expressed concerns to the Community Development Manager but was unable to collaborate with the manager to find a solution. The coordinator met with the CEO and tried to discuss ongoing issues. Despite efforts to communicate the severity of the situation to the CEO, the HR Department, and management, the coordinator was unsuccessful in their attempt to cancel the event. Due to the organization’s decision to proceed with the event, several staff members resigned. The organization proceeded with the event which ultimately was deemed unsuccessful.<\/p>", "directions": "<p>As you read this case study consider the concept of Think Like a Leader?  When doing this a leader should be able to<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components.  Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion<\/p>", "case": "<p>Small Nonprofit Hospice Organization was going through staff changes. The Community Development Department hired a new Fundraising and Events Coordinator, Marissa. The organization had a large event that needed to be planned. The department was comprised of three staff members. With the addition of a new coordinator, the department had three staff members and was adequately staffed for event planning.<\/p><p>Four months after the coordinator was hired, the Community Development Assistant, Colin, informed the Community Development Manager, Joanne, he needed to go on Family Medical Leave for twelve weeks. Colin’s absence left the department short-staffed, and therefore, unable to successfully plan the event. The organization had no plans to replace Colin during his absence.<\/p><p>During the twelve weeks, Marissa requested a meeting with Joanne. Marissa informed Joanne workload was sizeable and expressed concerns about the completion of tasks necessary to meet critical deadlines. Marissa also expressed concerns that Joanne was not meeting her deadlines or completing her work, which prevented planning for the event to progress as needed. Marissa requested Joanne approve of an increase in her hours, moving her from part-time to full-time until Colin’s returns to work. Joanne informed Marissa they must get approval from the CEO, Lena.<\/p><p>Two weeks after Marissa met with Joanne to discuss Marissa’s concerns, Joanne informed Marissa that Lena would approve only two additional hours per week. The additional hours would have Marissa working thirty-two hours per week instead of her typical thirty hours per week. Joanne informed Marissa that Lena did not approve of more than an additional 2 hours per week due to budget constraints.<\/p><p>After Marissa’s request to work additional hours was denied, Joanne began to interview contractors to support Marissa. Joanne and Marissa interviewed a candidate, Harper, for the position. Harper informed Joanne and Marissa that their rate of pay was $70.00 per hour. Joanne decided to hire Harper for ten hours a week. Joanne informed Marissa that Harper was being hired. Upon being informed of the decision, Marissa expressed frustration and confusion about hiring Harper. Hiring Harper did not align with the budget or with the Lena’s instructions to minimize expenditures associated with staffing; Harper’s hourly rate was three times that of Marissa’s.<\/p><p>Upon identifying inconsistencies concerning the budget and staffing capacity, Marissa requested a meeting with the Lena to discuss the budget, staffing hours, and to request clarification about Lena’s choice to deny Marissa’s request for additional hours. During the meeting, Lena informed Marissa that she had not denied any requests for increases in hours worked by staff or placed any restrictions on staffing due to budget constraints. Lena informed Marissa that decisions regarding staffing and budget expenditures were solely decided by Joanne. Marissa informed Lena that Joanne had communicated information that conflicted with Lena’s information.<\/p><p>Following the meeting with Lena, Marissa filed a complaint with the HR Department. Marissa expressed concerns about the success of the event and described the issues that had arisen because of Joanne’s actions. Marissa communicated that Joanne had missed deadlines, neglected to complete critical tasks, and had fabricated information concerning staffing and budgets. The HR manager informed Marissa that they would have a conversation with Joanne, but there were no plans for disciplinary actions.<\/p><p>Prior to reinstatement from family medical leave, Colin resigned from the position effective immediately. Colin informed Marissa that they were no longer interested in employment with the organization due to issues with Joanne. Colin stated that missed deadlines, poor communication, poor organization, and a lack of trust in Joanne led to his resignation.<\/p><p>Due to Colin’s resignation and Joanne’s continued lack of duty completion, event planning was affected critically.  Additionally, Harper became unresponsive and did not contribute to event planning despite being compensated. Marissa discussed concerns with Joanne again and advocated cancelling the event. Marissa believed that staffing shortages and lack of progress in planning would result in the event being unsuccessful and fiscally detrimental to the organization. Several support staff from other departments that helped coordinate agreed with Marissa’s assessment.<\/p><p>Joanne and Lena decided to move forward with the event despite several members of the organization advocating for cancellation. This decision led to the resignation of four members as well as Marissa’s resignation. The organization held the event but was unable to find the level of financial success and community participation that had occurred in previous years.<\/p>", "questions": "<ol><li>What examples can you see of the coordinator thinking like a leader?<\/li><li>What examples can you see of the manager thinking like a leader?<\/li><li>What are some examples of where the coordinator failed to think like a leader?<\/li><li>What are some examples of where the manager failed to think like a leader?<\/li><li>Imagine you are hired as a support staff member to help coordinate the event. What advice would you give Marissa to help her develop as a leader? What skills would you suggest she develop to deal with difficulties in communication? What do you think she could have done differently?<\/li><li>Imagine you are hired as an advisor to the manager. What advice would you give Joanne to help her develop as a leader? What skills would you suggest she develop to deal with difficulties in communication with her employees? What do you think she could have done differently?<\/li><\/ol>", "note": ""}}, {"number": 6, "title": "The Cedar Heights Ultimatum", "cohort": 4, "section": "Think Like a Leader", "topics": ["crisis response", "team disagreement", "delegation", "community stakeholders"], "skills": ["Triggers", "Values", "Adaptive"], "compelling_question": "How can a leader create a coherent strategy when the people affected by the crisis legitimately want different outcomes?", "permission": "not confirmed", "words": 873, "html": {"summary": "<p>A large apartment building attempts to evict a number of tenants in the winter. They call a small legal aid team to get help. The small team is overwhelmed by the competing values of the tenants themselves and also of the different priorities that the legal team has. The operations manager struggles to bring the team together behind a cohesive plan.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>Cedar Heights was a sprawling, 150-unit apartment complex on the edge of a mid-sized city. It had once been a stable, affordable community, but years of deferred maintenance had taken a toll. Leaking roofs, broken stairwells, mold creeping up walls. Tenants had complained for years, but the previous owner ignored them.<\/p><p>Then a new owner, Summit Ridge Communities, purchased the property. Their website promised “revitalization and modern living,” but tenants quickly learned what that meant: renovictions.<\/p><p>Within weeks, Summit Ridge issued 90-day notices to nearly half the tenants, citing “major renovations.” The notices were legal on their face, but the timing, in the middle of winter, felt cruel. Many tenants were elderly or disabled. Several families had children in the local school district. A few tenants had already been displaced twice in the past five years.<\/p><p>The Housing Justice Project assigned the case to Anjali Rao, a newly promoted program manager known for her strategic mind and calm demeanor. Anjali had strong technical skills and a reputation for fairness, but she often struggled with delegation and managing conflict, two things this case would demand.<\/p><p>Anjali convened her team, two attorneys, a community organizer, and a paralegal, to assess the situation. Immediately, tensions surfaced:<\/p><p>The organizer, Mateo, wanted to mobilize tenants for a public demonstration.<\/p><p>One attorney, Colleen, argued for filing an injunction immediately.<\/p><p>The other attorney, Marcus, believed negotiation was the only realistic path.<\/p><p>The paralegal, Rosa, worried about the emotional toll on tenants and urged a trauma-informed approach.<\/p><p>Anjali felt the pressure. She was used to being the one who “figured things out,” but now she had to lead a team with competing values and instincts. Her first impulse was to choose the legal route, lay it out to the team, get buy in and then manage that process.  But was she solving the problem or avoiding discomfort?<\/p><p>She asked each team member to articulate not just their recommendation, but why they believed it mattered. This shifted the conversation from positions to values.<\/p><p>Patterns emerged:<\/p><p>Mateo cared about empowerment.<\/p><p>Colleen cared about justice.<\/p><p>Marcus cared about pragmatism.<\/p><p>Rosa cared about safety and stability.<\/p><p>Anjali realized the team wasn’t divided, they were holding different pieces of the same puzzle.<\/p><p>At the first tenant meeting, more than 80 residents crowded into the community room. Emotions ran high. Some tenants were furious. Others were terrified. A few were resigned.<\/p><p>Anjali began with a legal overview, but halfway through, a tenant interrupted her:<\/p><p>“We don’t need laws right now. We need to know if we’re going to be homeless.”<\/p><p>The room erupted. Anjali felt her throat tighten. Public confrontation was one of her triggers, she tended to shut down or over-correct. She stopped speaking. She listened. She acknowledged fear without promising outcomes. She invited tenants to share what stability meant to them.<\/p><p>The tone shifted. The room softened. Trust began to form.<\/p><p>Over the next week, Summit Ridge escalated pressure. They sent contractors to measure units without notice. They posted signs warning tenants not to “interfere with renovation plans.” They offered small buyouts to tenants who agreed to leave quietly.<\/p><p>Tenants were split:<\/p><p>Some wanted to take the buyout.<\/p><p>Others wanted to fight.<\/p><p>Some wanted to negotiate for better terms.<\/p><p>A few wanted to go to the media.<\/p><p>Anjali felt the weight of choosing among competing values: speed vs. justice, safety vs. empowerment, individual needs vs. collective strategy. She created a decision tree with tenants, outlining the risks and benefits of each path. She didn’t tell them what to do, she helped them understand the landscape so they could choose. This was leadership through process, not authority.<\/p><p>The legal issues were straightforward:<\/p><p>Were the notices valid?<\/p><p>Were the renovations legitimate?<\/p><p>Were tenants entitled to relocation assistance?<\/p><p>But the adaptive issues were harder:<\/p><p>Tenants didn’t trust each other.<\/p><p>Some feared retaliation.<\/p><p>Others feared being judged for wanting to leave.<\/p><p>The team itself was still learning how to collaborate under pressure.<\/p><p>Anjali realized the real challenge wasn’t the eviction notices, it was building a community capable of making decisions together.<\/p><p>She delegated tasks (even though it was uncomfortable):<\/p><p>Mateo organized tenant leaders.<\/p><p>Colleen drafted legal filings.<\/p><p>Marcus prepared negotiation frameworks.<\/p><p>Rosa coordinated wellness check-ins.<\/p><p>Anjali focused on holding the center.<\/p><p>Not everyone was satisfied. Some tenants still moved. Others stayed. But the community felt more empowered, and the team at HJP felt more cohesive. This also set the team up in a better position to handle similar situations in the future.<\/p><p>Anjali later reflected that the hardest part wasn’t the law, it was learning to lead through uncertainty, conflict, and competing values while managing her own internal reactions.<\/p><p>The end result was that Anjali led a solution that allowed for tenants to make the best choices for themselves individually, with as much legal support from HJP that was allowed under the law and the scope of HJP.<\/p>", "questions": "<ol><li>Where do you see Anjali navigating her own strengths, vulnerabilities, and triggers? How did these internal dynamics shape her leadership choices?<\/li><li>What moments required Anjali to tolerate uncertainty rather than rush to a solution? How did this affect the outcome?<\/li><li>How did Anjali balance the competing values of justice, safety, empowerment, and speed? Which value would you have prioritized?<\/li><li>What parts of the Cedar Heights crisis were technical, and what parts were adaptive? How did Anjali shift between the two?<\/li><li>If you were advising Anjali at the start, what leadership goals would you set for her? Identify key inflection points where she could have strengthened her leadership practice.<\/li><\/ol>", "note": ""}}, {"number": 7, "title": "Two Jobs, One Paycheck", "cohort": 4, "section": "Think Like a Leader", "topics": ["workload", "friendship at work", "burnout"], "skills": ["Uncertainty", "Process"], "compelling_question": "How should a leader address workload inequity before goodwill turns into resentment and burnout?", "permission": "not confirmed", "words": 422, "html": {"summary": "<p>The counseling office plays a vital role in the emotional, social and academic success of their students at the high school. Counselors work by communicating with students, staff, parents, and outside resources to support their students' needs and every day a new situation arises. The Registrar’s office is located in the counseling office and their main duties are administrative secretarial work, record keeping, data analysis, registering and withdrawing students, and supporting staff with the schools data system. Recently, the Registrar has been taking on extra duties related to the counselors roles and an excessive amount of absences. Unfortunately, this has created tension in the counseling department and burnout for the registrar.<\/p>", "directions": "<p>As you read this case study, consider the concept of Think Like a Leader?  When doing this a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies.<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision.<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy.<\/li><\/ul><p>Look for evidence of these key leadership components.  Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers.<\/li><li>Get used to uncertainty and conflict.<\/li><li>Understand yourself but also be able to shift focus outward.<\/li><li>Choose among competing values.<\/li><li>Distinguish between technical and adaptive.<\/li><li>Understand the process challenge.<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>Located inside the counseling office at the high school are 3 different counselors along with the Registrars office. Throughout the last few months, the counseling department has been experiencing frequent absences from counselors due to illnesses and vacations. Through these inconsistencies with attendance, the Registrar has been asked to manage and facilitate extra duties that are not in their job description. Some days the tasks are simple and require minimal extra attention. But other days their primary role has to be set aside to work on the counselors tasks. These could include: communicating with parents and teachers about credit recovery, analyzing transcripts, helping facilitate conversations with students about scholarships and college applications, managing the counseling office TA’s and their behaviors and creating/changing students schedules.<\/p><p>The Registrar feels uncomfortable communicating their frustrations with the counselors because they have become good friends, and fear resentment. This has created stress on the Registrar and they are experiencing burnout. At this point they feel they are working 2 jobs and only receiving pay for one. Which in turn, has made them resentful of the counselors.<\/p><p>The Registrar has become increasingly frustrated as the tasks are piling up each day when another counselor is gone. The extra workload the Registrar has taken on seems to go unnoticed and has become an expectation. The Registrar has communicated their frustrations with administration but feels that nothing has changed or been done to rectify the situation. The counselors have exceeded the amount of approved days allowed for vacation, and each has used more than 10 days of sick time (which is the allotted amount for the school year). The 90% mandatory attendance rate is not being upheld and management has not stepped in to reinstill the policy. The relationship between the staff in the counseling office has become strained and the lack of communication seems to only be worsening.<\/p>", "questions": "<ol><li>How different would the leader role look for the counselor and for the Registrar in this situation?<\/li><li>What are the leadership qualities needed to navigate this challenging situation and how can these qualities be shown to help promote resilience and confidence within this team?<\/li><li>How can the counselors be held accountable and share the responsibility to help make sure students' support is being met when others are absent?<\/li><li>How could the Registrar approach this situation differently, instead of going directly to administration?<\/li><li>What communication tools can the Registrar use to voice their concerns, while maintaining a professional structure?<\/li><\/ol>", "note": ""}}, {"number": 8, "title": "No Cuts, No Easy Answers", "cohort": 4, "section": "Think Like a Leader", "topics": ["fairness", "inclusion", "rebuilding trust", "youth sports"], "skills": ["Uncertainty", "Values"], "compelling_question": "How should a leader define fairness when inclusion, development, playing time, and staff capacity all point toward different decisions?", "permission": "not confirmed", "words": 386, "html": {"summary": "<p>A high school summer basketball program launched under new leadership after a season filled with complaints about communication, treatment of players, and coaching decisions. With 54 athletes signed up for a one month season, the athletic director instructed the new interim head coach not to cut any players in an effort to rebuild trust and create a more inclusive environment. However, the assistant coaches pushed back, arguing that teams should be capped at ten players to prioritize development and manage playing time. Trying to balance fairness, inclusion, and the coaching staff’s concerns, the head coach created a flexible rotation system that allowed larger rosters while still giving players competitive opportunities. The experience revealed how challenging it is to lead when multiple stakeholders players, parents, coaches, and administrators hold conflicting expectations.<\/p>", "directions": "<p>As you read this case, think about the core concepts of Think Like a Leader.<\/p><p>Consider:<\/p><ul><li>When does a leader need to be adaptable, especially when plans shift quickly?<\/li><li>How does emotional intelligence help rebuild trust after conflict?<\/li><li>How does communication influence culture, expectations, and team morale?<\/li><li>How does a leader practice integrity and fairness when every decision affects someone differently?<\/li><\/ul><p>Use these lenses to analyze the leadership choices made in the case and imagine alternative approaches.<\/p>", "case": "<p>The summer basketball season began with the new coach stepping into a program still carrying the weight of previous controversy. Players and parents had complained about inappropriate comments, unclear expectations, and a lack of trust from the former head coach. Morale was low, and several relationships had been damaged.<\/p><p>When 54 students signed up for the condensed summer session, the athletic director made a plea.<\/p><p>“Please, No cuts !. Can you find a spot for everyone?”<\/p><p>This request immediately created tension. The assistant coaches felt strongly that rosters of more than ten players would be an overload for them to manage, which reduces playing time, and frustrate the most committed players. They argued that smaller teams created a stronger competitive environment.<\/p><p>The head coach saw the situation differently. Cutting players would only repeat the problems of the previous season and ignore the athletic director’s desire to rebuild trust. After several conversations, some calm, some tense, a middle ground emerged:<\/p><p>A rotation system that allowed teams to roster more than ten players, while distributing playing time across games based on attendance, effort, and availability.<\/p><p>This compromise required constant communication, empathy, and adaptability. Some parents still disliked the structure. Some assistant coaches remained skeptical. Some players wanted more clarity about playing time. Yet, the season moved forward with fewer conflicts than expected because communication improved, expectations became clearer, and the leadership approach emphasized flexibility over rigidness.<\/p><p>The case highlights what leadership looks like when time is limited, pressure is high, and every decision affects multiple people at once.<\/p>", "questions": "<ol><li>Rebuilding Trust: What leadership strategies are most effective for rebuilding trust when a previous leader has left behind damaged relationships?<\/li><li>Balancing Competing Expectations: How should a leader navigate fairness and integrity when players, parents, and assistant coaches all want different outcomes?<\/li><li>Communication &amp; Culture: In emotionally sensitive environments like youth sports, how does transparent communication shape the culture of the team?<\/li><li>Adaptive Thinking: What does adaptive leadership look like when resources are limited (time, roster spots, coaching staff cooperation)?<\/li><li>Reflection: If you were leading this program next summer, what leadership choices would you repeat, and what would you change? Why?<\/li><\/ol>", "note": ""}}, {"number": 9, "title": "The Leader Who Could Not Stop Fixing Everything", "cohort": 4, "section": "Think Like a Leader", "topics": ["new supervisor", "delegation", "training"], "skills": ["Triggers", "Outward"], "compelling_question": "When does stepping in to fix problems stop helping the team and start preventing the team from becoming capable on its own?", "permission": "not confirmed", "words": 497, "html": {"summary": "<p>This case study highlights real problems in the work place (almost every work place) where someone promotes to team lead due to their high level of performance, new employees get hired on and begin taking on tasks.<\/p>", "directions": "<p><em>(Standard directions added. The author did not include any.)<\/em><\/p><p>As you read this case study, consider the concept of Think Like a Leader. When doing this, a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities, and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion.<\/p>", "case": "<p>When I was promoted to team leader, it felt like a natural next step. Having performed well as an employee for a long time, I was somewhat confident about taking on higher responsibility. The team was small at first and expectations from upper management weren’t as high which is why I thought I could take on more responsibility. The role was processing invoices, handling vendor payments, and resolving payment issues. The department had a reputation for being reliable and making payments quicker than expected.<\/p><p>At first, I approached the role by staying involved in the team’s work. We were a small team that needed to hire new employees to complete the team. As two new employees were hired, things became tougher because of training processes. While Dan asked for more instruction, Lori seemed unsure about priorities. Lori kept on doing other things rather than her own job. There were a lot of issues with duplicate payments, scanned documents, and etc. Rather than trusting the new employees fully with their duties, I often stepped in to fix errors or complete parts of projects to make sure everything was done correctly. This meant I spent less time for my own projects and duties. Communication is key. I would like to make sure everyone understand their roles and responsibilities.<\/p><p>I had to change something so after a conversation with a manager, we decided to try a different approach. We had a meeting and decided that weekly check-ins were important, which meant we had weekly meetings. I brought the team together and asked what we can do as a team to become more efficient, work independently and still support one another when needed. Responsibilities were outlined more clearly. This seemed to improve communication within the team. Dan became more confident in his role, while Lori still hesitated without direct input. At the same time, I began focusing on managing time more efficiently. Instead of jumping between tasks, I started working on the tasks one by one. However, when unexpected issues came up, those projects were often pushed aside and worked on later.<\/p><p>As the workload continued to grow, I noticed that the team’s performance varied from project to project. Some vendors were very satisfied, while others required follow-ups and revisions on late payments. With several important deadlines approaching, I began to question how to best support the team while still meeting expectations from leadership.<\/p><p>Moving forward, I would suggest to create a manual or resource guide that employees can refer to and we can guide new employees to. I would also suggest to cross train employees so that they can do the same within their scope of work. This would benefit the department and maintain accuracy and effectiveness and efficiency while keeping organizational growth.<\/p>", "questions": "<ol><li>What leadership challenges am I facing, and how are they affecting the team?<\/li><li>How might my approach to delegation affect team performance?<\/li><li>How can clear communication prevent confusion without me needing to intervene?<\/li><li>If you were in my position, how would you balance control and trust within the team?<\/li><\/ol>", "note": ""}}, {"number": 10, "title": "Recovery Is Not a Straight Line", "cohort": 4, "section": "Think Like a Leader", "topics": ["client care", "staff burnout", "limited resources"], "skills": ["Uncertainty", "Values", "Adaptive"], "compelling_question": "How should a leader respond when staff burnout begins to challenge the team's commitment to individualized, person-centered care?", "permission": "not confirmed", "words": 625, "html": {"summary": "<p>A local Treatment Addiction Team is working with an individual who reports that he wants to work toward long-term sobriety but is struggling with active substance use and cycles of relapse. The individual has a long history with the addiction treatment team spanning over 10 years. Some of the long-term staff believe that the individual is not serious about his recovery. The supervisor must decide how to support the individual while also addressing the staffing frustrations and keeping the team focused on safety, person-centered care and treatment. Failure to treat substance use individuals can lead to several safety risks including the risk of withdrawal, overdose and even disengagement in treatment.<\/p>", "directions": "<p>As you read this case study consider the concept of Think Like a Leader? When doing this a leader should be able to:<\/p><ul><li>Develop comprehensive project plans, monitor the plans, identify areas of risk and deal with problems using appropriate strategies<\/li><li>Identify the significant and key decisions that need to be made, gather the necessary resources or people to make the decision<\/li><li>Identify and describe personal leadership style, characteristics, strengths, and philosophy<\/li><\/ul><p>As you read, look for evidence of these key leadership components. Also consider if you see evidence of these key leadership skills:<\/p><ul><li>Know your strengths, vulnerabilities and triggers<\/li><li>Get used to uncertainty and conflict<\/li><li>Understand yourself but also be able to shift focus outward<\/li><li>Choose among competing values<\/li><li>Distinguish between technical and adaptive<\/li><li>Understand the process challenge<\/li><\/ul><p>There will be questions following this scenario for further discussion<\/p>", "case": "<p>A local Addiction Treatment Center engages adults that are struggling with substance use. The treatment addiction team includes certified alcohol and drug counselors, certified recovery mentors, and supervisors. The primary goals of the treatment center are to empower the individual to overcome addiction and gain an improved life skills to maintain a safe and stable lifestyle.<\/p><p>Ray is a client in his mid-40s that has been struggling to stop his substance use (methamphetamines, heroin and marijuana.) Ray has been enrolled in addiction treatment services many times over the last 10 years and has been unsuccessful in maintaining long term sobriety. Ray has worked with several differe
